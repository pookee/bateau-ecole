      pct = cpt[qv.ok]/repondu.length;
      // stats par élève
      repondu.forEach(e=>{ const el=S.stats.el[e.n]=S.stats.el[e.n]||{}; const a=el[q.n]=el[q.n]||[0,0]; a[1]++; if(rep[e.n]===LET[qv.ok]) a[0]++; });
      Son.cloche();
      pct = await afficheScore(pct, `${cpt[qv.ok]} bonne${cpt[qv.ok]>1?"s":""} réponse${cpt[qv.ok]>1?"s":""} sur ${repondu.length}`, mode);

function trucDe(q){ if(q.truc) return q.truc; const m=/^d(\d+)$/.exec(q.id||""); if(m){ const r=Q_RAW[+m[1]]; if(r && r[1]===q.q && typeof TRUCS!=="undefined") return TRUCS[+m[1]]; } return ""; }
function afficheTruc(q){ const t=trucDe(q); if(!t) return; const p=$("#q-pied"); if(!p) return;
  p.insertAdjacentHTML("beforebegin",`<div class="truc"><img src="img/perroquet-salut.webp" alt=""><div><b>Le truc du perroquet</b><span>${esc(t)}</span></div></div>`); }
function gainPour(pct){ return Math.max(1,Math.round((1+4*pct)*S.reglages.vitesse)); }
async function afficheScore(pct, texte, mode){

  if (mode==="matin"||mode==="tresor"){ S.milles = Math.min(TOTAL, S.milles + gainPour(pct)); Mer.rafale(pct); Son.vent(); majBarre(); majMer(); sauve(); }
  else { Mer.rafale(pct); if (pct<.5){ Mer.eclair(); Son.tonnerre(); } }

}

/* ---------- déroulé d'un rituel ---------- */
let orageForce = 100;

async function rituel(mode){
  if (enJeu) return; enJeu = true;
  Son.init(); Son.mer(true);
  const n = mode==="tempete" ? S.reglages.stormQ : mode==="tresor" ? 12 : S.reglages.nbQ;
  const qs = choisirQuestions(n);
  if (!qs.length){ toast("Aucune question disponible : coche des notions « déjà vues » dans les réglages."); enJeu=false; return accueil(); }
  const p = position(S.milles);

      <p class="sous">Avant les vacances, une grande révision : ${qs.length} questions sur toutes les notions vues, en 3 manches. À la fin de chaque manche, un coffre s'ouvre si l'équipage a au moins 60 % de bonnes réponses.</p>

      <div class="centre"><button class="btn prim big" data-go="go">Larguer les amarres !</button><button class="btn" data-go="non">Retour</button></div>`);
  }
  if ((await attendre())==="non"){ enJeu=false; return accueil(); }
  chrono(true);
  const depart = S.milles; const res = []; ritExtra = [];
  orageForce = 100;
  for (let i=0;i<qs.length;i++){
    const pct = await poserQuestion(qs[i], i, qs.length, mode);
    res.push({q:qs[i],pct});
    if (mode==="tempete"){ orageForce -= pct*(100/qs.length)*1.35; Mer.orage(Math.max(.25,orageForce/100)); }
    else if (mode==="tresor"){ await verifArrivee(); if ((i+1)%4===0){ const man=res.slice(-4); await coffre((i+1)/4, man.reduce((s,r)=>s+r.pct,0)/man.length); } }

async function bilan(res, gagne, mode){

  const det = Object.entries(par).map(([id,arr])=>{ const {n,m}=matiere(id); return `${m.nom} · ${n.t} : ${Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*100)} %`; });

/* ---------- mini-jeux du pilote ---------- */
const MiniJeu = (() => {
  function prepare(){
    layer.innerHTML = "";
    const cv = document.createElement("canvas"); cv.id="mini"; $("#stage").appendChild(cv);
    const hud = document.createElement("div"); hud.className="hud"; $("#stage").appendChild(hud);
    const r = cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
    return {cv,g,hud,W:r.width,H:r.height,fin(){cv.remove();hud.remove();}};
  }
  function fondEau(g,W,H,t){
    const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#5CC6D6"); gr.addColorStop(1,"#1E86A6"); g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.strokeStyle="rgba(255,255,255,.18)"; g.lineWidth=3;
    for(let y=30;y<H;y+=46){ g.beginPath(); for(let x=-40;x<W+40;x+=20){ const xx=x-((t*120)%40); g.lineTo(xx,y+Math.sin((xx+y)/30+t*2)*5); } g.stroke(); }
  }
  function bateauDessus(g,x,y,s,flash){
    const im=IMG["bateau-dessus"]; if(pret(im)){ const w=190*s,h=w*im.naturalHeight/im.naturalWidth; g.save(); if(flash) g.globalAlpha=.45; g.drawImage(im,x-w*.55,y-h/2,w,h); g.restore(); return; }
    g.save(); g.translate(x,y);
    g.fillStyle=flash?"#FFD86B":"#C8433A"; g.beginPath(); g.moveTo(70*s,0); g.quadraticCurveTo(30*s,-28*s,-55*s,-24*s); g.lineTo(-55*s,24*s); g.quadraticCurveTo(30*s,28*s,70*s,0); g.fill();
    g.fillStyle="#F3D9A4"; g.beginPath(); g.ellipse(0,0,40*s,14*s,0,0,Math.PI*2); g.fill();
    g.fillStyle="#FFFCF4"; g.beginPath(); g.moveTo(-10*s,-4*s); g.quadraticCurveTo(10*s,-40*s,30*s,-36*s); g.lineTo(-10*s,4*s); g.fill();
    g.restore();
  }
  function rochers(){
    return new Promise(res=>{
      const M = prepare(); const {g,W,H,cv,hud}=M; const g0=GEN;
      const s = Math.max(.7,Math.min(1.4,H/500));
      const bx = Math.max(W*.18, 115*s); let by=H/2, cible=H/2, t0=performance.now(), dern=0, touches=0, evites=0, flash=0;
      const roches=[]; const DUREE=15;
      const pos = e=>{ const r=cv.getBoundingClientRect(); cible = Math.max(60,Math.min(H-60,e.clientY-r.top)); };
      cv.addEventListener("pointerdown", e=>{ cv.setPointerCapture(e.pointerId); pos(e); });
      cv.addEventListener("pointermove", e=>{ if(e.buttons||e.pointerType==="touch"||e.pointerType==="pen") pos(e); });
      function frame(now){
        if (g0!==GEN){ M.fin(); return; }
        const t=(now-t0)/1000, dt=Math.min(.05,(now-(frame.l||now))/1000); frame.l=now;
        by += (cible-by)*Math.min(1,dt*9);
        if (t-dern > Math.max(.55,1.1-t*.04) && t<DUREE-1.2){ dern=t; roches.push({x:W+60,y:60+Math.random()*(H-120),r:(30+Math.random()*26)*s,touche:false,ok:false,k:1+Math.floor(Math.random()*3)}); }
        const v = W/(3.6-Math.min(1.4,t*.08));
        fondEau(g,W,H,t);
        roches.forEach(r=>{ r.x-=v*dt;
          const ri=IMG["rocher"+r.k]; if(pret(ri)){ const w=r.r*2.4,h=w*ri.naturalHeight/ri.naturalWidth; g.drawImage(ri,r.x-w/2,r.y-h/2,w,h); }
          else { g.fillStyle="#6F7C86"; g.beginPath(); g.ellipse(r.x,r.y,r.r,r.r*.8,0,0,Math.PI*2); g.fill(); }
          if(!r.touche && Math.abs(r.x-bx)<r.r+50*s && Math.abs(r.y-by)<r.r+18*s){ r.touche=true; touches++; flash=.5; Son.plouf(); }
          if(!r.ok && !r.touche && r.x<bx-60*s){ r.ok=true; evites++; }
        });
        for(let k=roches.length-1;k>=0;k--) if(roches[k].x<-80) roches.splice(k,1);
        flash=Math.max(0,flash-dt);
        bateauDessus(g,bx,by,s,flash>0&&Math.floor(flash*10)%2===0);
        const reste=Math.max(0,Math.ceil(DUREE-t));
        hud.textContent = `Rochers évités : ${evites} · Touchés : ${touches} · ${reste} s`;
        if (t<DUREE) requestAnimationFrame(frame);
        else { M.fin(); res(Math.max(0,Math.min(8,evites-2*touches))); }
      }
      requestAnimationFrame(frame);
    });
  }
  function bouteilles(){
    return new Promise(res=>{
      const M = prepare(); const {g,W,H,cv,hud}=M; const g0=GEN;
      const s = Math.max(.7,Math.min(1.4,H/500));
      let t0=performance.now(), dern=0, prises=0; const bt=[], bulles=[]; const DUREE=14;
      cv.addEventListener("pointerdown", e=>{ const r=cv.getBoundingClientRect(); const x=e.clientX-r.left,y=e.clientY-r.top;
        for(let k=bt.length-1;k>=0;k--){ const b=bt[k]; if(Math.hypot(b.x-x,b.y-y)<48*s){ bt.splice(k,1); prises++; Son.pop(); for(let i=0;i<10;i++) bulles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.8)*200,v:1}); break; } } });
      function frame(now){
        if (g0!==GEN){ M.fin(); return; }
        const t=(now-t0)/1000, dt=Math.min(.05,(now-(frame.l||now))/1000); frame.l=now;
        if (t-dern>.75 && t<DUREE-1){ dern=t; bt.push({x:-40,y:80+Math.random()*(H-160),v:(W/(4.5+Math.random()*2)),ph:Math.random()*6}); }
        fondEau(g,W,H,t);
        bt.forEach(b=>{ b.x+=b.v*dt; const y=b.y+Math.sin(t*3+b.ph)*10;
          g.save(); g.translate(b.x,y); g.rotate(Math.sin(t*2+b.ph)*.4-.5);
          const bi=IMG.bouteille; if(pret(bi)){ const h=92*s,w=h*bi.naturalWidth/bi.naturalHeight; g.rotate(.9); g.drawImage(bi,-w/2,-h/2,w,h); }
          else { g.fillStyle="rgba(170,230,200,.85)"; g.beginPath(); g.roundRect(-30*s,-13*s,50*s,26*s,10*s); g.fill(); }
          g.restore(); });
        for(let k=bt.length-1;k>=0;k--) if(bt[k].x>W+60) bt.splice(k,1);
        bulles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.v-=dt*1.5; g.fillStyle=`rgba(255,255,255,${Math.max(0,p.v)})`; g.beginPath(); g.arc(p.x,p.y,6,0,Math.PI*2); g.fill(); });
        const reste=Math.max(0,Math.ceil(DUREE-t));
        hud.textContent = `Bouteilles repêchées : ${prises} · ${reste} s`;
        if (t<DUREE) requestAnimationFrame(frame);
        else { M.fin(); res(Math.min(8,prises)); }
      }
      requestAnimationFrame(frame);
    });
  }
  return {rochers, bouteilles};
})();

function panneau(html,cls){
  document.querySelector(".panneau")?.remove();
  const d=document.createElement("div"); d.className="panneau"; d.innerHTML=`<div class="carte ${cls||""}" style="max-width:1150px">${html}<button class="btn fermer" data-x="1">Fermer</button></div>`;

}
const X = lo => { let x=lo+170; while(x<0)x+=360; while(x>=360)x-=360; return x; };
const Y = la => 85-la;
function segments(a,b){ // liste de segments [x1,y1,x2,y2] avec passage du bord
  let d=b.lo-a.lo; if(d>180)d-=360; if(d<-180)d+=360;
  const x1=X(a.lo),y1=Y(a.la),x2=x1+d,y2=Y(b.la);
  if (x2>=0 && x2<360) return [[x1,y1,x2,y2]];
  const bord = x2<0?0:360, k=(bord-x1)/(x2-x1), ym=y1+(y2-y1)*k;
  return [[x1,y1,bord,ym],[360-bord,ym,x2+(x2<0?360:-360),y2]];
}
function ouvreCarte(){
  const p=position(S.milles); const vues=new Set(S.escalesVues);
  let route="", faite="";
  for(let i=0;i<ESCALES.length-1;i++){
    const segs=segments(ESCALES[i],ESCALES[i+1]);
    segs.forEach(s=>{ const l=`<line x1="${s[0].toFixed(1)}" y1="${s[1].toFixed(1)}" x2="${s[2].toFixed(1)}" y2="${s[3].toFixed(1)}"/>`; if(i<p.i) faite+=l; else route+=l; });
    if (i===p.i && !p.fin){ // morceau déjà parcouru de l'étape en cours
      const a=ESCALES[i],b=ESCALES[i+1]; let d=b.lo-a.lo; if(d>180)d-=360; if(d<-180)d+=360;
      const m={lo:a.lo+d*p.p, la:a.la+(b.la-a.la)*p.p};
      segments(a,m).forEach(s=>faite+=`<line x1="${s[0].toFixed(1)}" y1="${s[1].toFixed(1)}" x2="${s[2].toFixed(1)}" y2="${s[3].toFixed(1)}"/>`);
      ouvreCarte.bx=X(m.lo); ouvreCarte.by=Y(m.la);
    }
  }
  if (p.fin){ ouvreCarte.bx=X(ESCALES[0].lo); ouvreCarte.by=Y(ESCALES[0].la); }
  const pts = ESCALES.slice(0,-1).map((e,k)=>{ const ok=vues.has(k); const x=X(e.lo),y=Y(e.la);
    const lab = (ok||k===p.i+1) ? `<text x="${(x+2).toFixed(1)}" y="${(y-1.6).toFixed(1)}">${esc(e.v)}</text>` : "";
    return `<g data-esc="${k}"><circle class="esc ${ok?"ok":""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${ok?1.5:1.1}"/>${lab}</g>`; }).join("");
  const d = panneau(`<h2>Carte du voyage</h2>
    <p class="note" style="margin:0 0 10px">${S.escalesVues.length-1} escale${S.escalesVues.length>2?"s":""} visitée${S.escalesVues.length>2?"s":""} sur ${ESCALES.length-1}. Touche une escale rouge pour revoir sa carte postale.</p>

      <path class="terre" d="${LAND}"/>
      <g class="route">${route}</g><g class="faite">${faite}</g>${pts}
      <g transform="translate(${ouvreCarte.bx.toFixed(1)},${ouvreCarte.by.toFixed(1)})"><circle r="3.2" fill="#FFC94A" stroke="#0B2740" stroke-width=".5"/><path d="M-1.8 .6 L1.8 .6 L1.2 1.6 L-1.2 1.6Z M0 .6 L0 -2 L1.5 .2Z" fill="#0B2740"/></g>
    </svg>`,"carte-monde");
  d.querySelector("svg").addEventListener("click",e=>{ const g=e.target.closest("[data-esc]"); if(!g) return; const k=+g.dataset.esc; if(!vues.has(k)||enJeu) return; d.remove(); cartePostale(k,false).then(accueil); });

        <div class="opts">${[0,1,2,3].map(k=>`<label><input type="radio" name="fq-ok" value="${k}" ${q.ok===k?"checked":""} aria-label="Bonne réponse ${LET[k]}"><b>${LET[k]}</b><input type="text" id="fq-c${k}" value="${esc(q.c[k]||"")}" placeholder="${k<2?"Réponse":"Réponse (facultative)"}" maxlength="90"></label>`).join("")}</div>
        <span class="note">Coche le rond de la bonne réponse.</span>
        <label for="fq-truc">Le truc du perroquet (explication affichée après la réponse, facultatif)</label><textarea id="fq-truc" rows="2" maxlength="220">${esc(q.truc||(typeof trucDe==="function"?trucDe(q):""))}</textarea>
        <div class="ligne"><button class="btn prim" data-save="${q.id}">Enregistrer</button><button class="btn" data-annule="1">Annuler</button></div></div>`;
      zone._q = q; }
    if (t.dataset.annule){ t.closest("[data-form]").innerHTML=""; }
    if (t.dataset.save){ const zone=t.closest("[data-form]"), q=zone._q;
      const txt=zone.querySelector("#fq-t").value.trim(); const ch=[0,1,2,3].map(k=>zone.querySelector("#fq-c"+k).value.trim());
      const ok=+(zone.querySelector('input[name="fq-ok"]:checked')||{value:0}).value;
      if(!txt){ toast("Écris la question."); return; }
      if(!ch[ok]){ toast("La bonne réponse est vide."); return; }
      const garde=[]; let nok=0; ch.forEach((v,k)=>{ if(v){ if(k===ok) nok=garde.length; garde.push(v); } });
      if(garde.length<2){ toast("Il faut au moins 2 réponses."); return; }

      S.notions.push({id:"n"+Date.now().toString(36),m:$("#nn-m").value,t:titre,vue:true}); sauve(); rendQuestions(c); }

const Musique = (() => {
  let au=null, cur=-1;
  const idx = k => (k>=ESCALES.length-1 ? 0 : k);
  function stop(){ if(au){ au.pause(); au.currentTime=0; } cur=-1; majBoutons(); }
  function majBoutons(){ document.querySelectorAll('[data-go="musique"]').forEach(b=>{ b.textContent = cur>=0 ? "Arrêter l'hymne" : "Écouter l'hymne"; }); }
  function joue(k){
    const i=idx(k);
    if (cur===i && au && !au.paused){ stop(); return; }
    if (!au){ au=new Audio(); au.preload="none"; au.addEventListener("ended",()=>{ cur=-1; majBoutons(); }); }
    au.src = AudioPerso.url("mus-"+i) || ("hymnes/hymne"+String(i).padStart(2,"0")+".mp3"); au.volume = .9; cur=i;
    au.play().catch(()=>{ cur=-1; majBoutons(); toast("La musique n'a pas pu démarrer."); });
    majBoutons();
  }
  function credit(k){ const m=Object.assign({}, MUSIQUES[idx(k)]||{}); const o=AudioPerso.get("mus-"+idx(k))||{}; ["t","a","l"].forEach(x=>{ if(o[x]!=null && o.id || o[x]) m[x]=o[x]; });
    return "♪ "+[m.t,m.a,m.l].filter(Boolean).join(" · "); }
  return { joue, stop, credit, info:k=>MUSIQUES[idx(k)] };
})();

async function tamponner(k){
  S.tampons = S.tampons||{};

  layer.innerHTML = `<div class="carte carte-monde" style="max-width:1000px">
    <div class="msg-big" style="color:#4A2C10">Le passeport de l'équipage</div>

    ${htmlPasseport(k)}</div>`;
  await new Promise(res=>{ const h=ev=>{ const c=ev.target.closest(".case.a-tamponner"); if(!c) return; layer.removeEventListener("click",h); enAttente.delete(stop); res(); }; const stop=()=>layer.removeEventListener("click",h); layer.addEventListener("click",h); enAttente.add(stop); });
  S.tampons[k] = new Date().toISOString(); if (k<ESCALES.length-1) S.carteAEcrire = k; sauve();

  const avant = grade(k-1), apres = grade(k);

  layer.querySelector(".carte").insertAdjacentHTML("beforeend", `<div class="centre" style="margin-top:14px">${final?"":`<button class="btn mer big" data-go="album">Voir l'animal dans l'album</button>`}<button class="btn prim big" data-go="ok">Continuer</button></div>`);

    layer.innerHTML = avecPerro("bravo",900,`<div class="msg-big">Nouvel animal dans l'album !</div>
      <div class="vignette ok grande"><img src="${imgEscale(k)}" alt=""><figcaption><b>${esc(e.anN)}</b><span>${esc(e.v)}, ${esc(e.p)}</span></figcaption></div>
      <div class="centre"><button class="btn prim big" data-go="ok">Continuer</button></div>`);
    Son.cloche(); await attendre();
  }
  noteJournal({type:"escale", titre: final?`Retour à ${e.v} : le tour du monde est terminé !`:`Arrivée ${aLieu(e.v)} (${e.p})`, esc:e.v, m:0,
    det:["Passeport tamponné"].concat(final?[]:[`Nouvel animal dans l'album : ${e.anN.split(",")[0]}`], apres>avant?[`Promotion : l'équipage devient « ${GRADES[apres][1]} »`]:[])});
  sauve();
  if (apres>avant){
    Son.fanfare();
    layer.innerHTML = avecPerro("bravo",860,`<div class="sous" style="text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--corail)">Promotion !</div>
      <div class="msg-big" style="font-size:clamp(2rem,4.4vw,3.4rem)">L'équipage devient : ${GRADES[apres][1]}</div>
      <p class="sous" style="font-size:1.6rem">${etoiles(apres)}</p>

      <div class="centre"><button class="btn prim big" data-go="ok">Hissez les voiles !</button></div>`);
    await attendre();

}

/* ---------- sons personnalisés : musiques, voix « bonjour » et effets remplaçables depuis les réglages ---------- */
/* Les fichiers sont réencodés dans le navigateur (Opus dans un conteneur WebM), puis rangés dans les fichiers de la page.
   L'index (quel son remplace quoi) est gardé dans la base de la page, doc « jeu/audio », à part du voyage :
   « Tout recommencer » et le mode démo n'y touchent pas. */
const AudioPerso = (() => {
  let data = {}; try { data = JSON.parse(lsGet("bateau-ecole-audio")||"{}")||{}; } catch(e){ data = {}; }
  let db = null, ecr = Promise.resolve();
  const get = k => (data[k] && typeof data[k]==="object") ? data[k] : null;
  const url = k => { const o=get(k); return o && o.id ? (window.__urlAsset ? window.__urlAsset(o.id) : "/_blob/"+o.id) : null; };
  function sauveA(){
    data.__maj = Date.now(); lsSet("bateau-ecole-audio", JSON.stringify(data));
    if (db){ const copie = JSON.parse(JSON.stringify(data)); ecr = ecr.then(()=>db.doc("jeu/audio").set(copie)).catch(e=>console.warn("audio", e&&e.code)); }
  }
  function set(k,o){ data[k] = Object.assign({}, get(k)||{}, o, {maj:Date.now()}); sauveA(); }
  function del(k){ delete data[k]; sauveA(); }
  async function branche(){
    db = await useCap("db"); if (!db) return;
    try {
      const snap = await db.doc("jeu/audio").get();
      if (snap.exists){ const d = snap.data()||{}; if ((d.__maj||0) > (data.__maj||0)){ data = d; lsSet("bateau-ecole-audio", JSON.stringify(data)); } else if ((data.__maj||0) > (d.__maj||0)) sauveA(); }
      else if (data.__maj) sauveA();
    } catch(e){ console.warn("audio lecture", e&&e.code); }
  }
  return { get, url, set, del, branche };
})();

/* ---------- encodage dans le navigateur : extrait → Opus/WebM ---------- */
const Encodeur = (() => {
  const cat = arr => { let n=0; arr.forEach(a=>n+=a.length); const o=new Uint8Array(n); let p=0; arr.forEach(a=>{ o.set(a,p); p+=a.length; }); return o; };
  const ids = h => Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
  function vint(n){ for (let l=1;l<=8;l++){ if (n < Math.pow(2,7*l)-1){ const o=new Uint8Array(l); let v=n; for(let i=l-1;i>=0;i--){ o[i]=v%256; v=Math.floor(v/256); } o[0] |= (0x80>>(l-1)); return o; } } throw new Error("taille"); }
  function uint(n){ const b=[]; do { b.unshift(n%256); n=Math.floor(n/256); } while(n>0); return Uint8Array.from(b); }
  function f64(x){ const b=new Uint8Array(8); new DataView(b.buffer).setFloat64(0,x); return b; }
  const txt = s => new TextEncoder().encode(s);
  const el = (h, payload) => cat([ids(h), vint(payload.length), payload]);
  function opusHead(ch, sr){ const b=new Uint8Array(19); b.set(txt("OpusHead"),0); b[8]=1; b[9]=ch; const dv=new DataView(b.buffer); dv.setUint16(10,312,true); dv.setUint32(12,sr,true); dv.setInt16(16,0,true); b[18]=0; return b; }
  function webm(paquets, desc, ch, sr, dureeS){
    const head = el("1A45DFA3", cat([el("4286",uint(1)),el("42F7",uint(1)),el("42F2",uint(4)),el("42F3",uint(8)),el("4282",txt("webm")),el("4287",uint(4)),el("4285",uint(2))]));
    const info = el("1549A966", cat([el("2AD7B1",uint(1000000)),el("4D80",txt("Bateau-ecole")),el("5741",txt("Bateau-ecole")),el("4489",f64(dureeS*1000))]));
    const pre = desc ? new DataView(desc.buffer,desc.byteOffset,desc.byteLength).getUint16(10,true) : 312;
    const piste = el("AE", cat([el("D7",uint(1)),el("73C5",uint(1)),el("83",uint(2)),el("86",txt("A_OPUS")),el("63A2",desc||opusHead(ch,sr)),
      el("56AA",uint(Math.round(pre/48000*1e9))),el("56BB",uint(80000000)),el("E1",cat([el("B5",f64(sr)),el("9F",uint(ch))]))]));
    const tracks = el("1654AE6B", piste);
    const clusters = []; let debC = null, blocs = [];
    const ferme = () => { if (debC===null) return; clusters.push(el("1F43B675", cat([el("E7",uint(debC))].concat(blocs)))); blocs=[]; };
    paquets.forEach(p=>{ const ms = Math.max(0,Math.round(p.t/1000));
      if (debC===null || ms-debC >= 1000){ ferme(); debC = ms; }
      const rel = ms-debC; const h = new Uint8Array(4); h[0]=0x81; h[1]=(rel>>8)&0xff; h[2]=rel&0xff; h[3]=0x80;
      blocs.push(el("A3", cat([h,p.b]))); });
    ferme();
    const seg = cat([info, tracks].concat(clusters));
    return new Blob([head, ids("18538067"), vint(seg.length), seg], {type:"video/webm"});
  }
  async function decode(buf){
    const AC = window.AudioContext||window.webkitAudioContext; const ctx = new AC();
    try { return await new Promise((res,rej)=>{ const p = ctx.decodeAudioData(buf.slice(0), res, rej); if (p && p.then) p.then(res,rej); }); }
    finally { try { ctx.close(); } catch(e){} }
  }
  /* extrait, fondus, volume égalisé, rééchantillonné à 48 kHz */
  async function rendre(src, {deb=0, dur, fondus=true, egalise=true}){
    const sr = 48000; deb = Math.max(0, Math.min(deb, src.duration-.05)); dur = Math.max(.2, Math.min(dur||src.duration, src.duration-deb));
    const ch = Math.min(2, src.numberOfChannels);
    let g = 1;
    if (egalise){ let s=0, n=0, pic=0; const a=Math.floor(deb*src.sampleRate), b=Math.min(src.length, Math.floor((deb+dur)*src.sampleRate));
      for (let c=0;c<ch;c++){ const d=src.getChannelData(c); for(let i=a;i<b;i+=3){ const v=d[i]; s+=v*v; n++; const av=Math.abs(v); if(av>pic) pic=av; } }
      const rms = Math.sqrt(s/Math.max(1,n)); if (rms>1e-4) g = Math.min(.12/rms, .97/Math.max(pic,1e-4), 8); }
    const oc = new OfflineAudioContext(ch, Math.round(dur*sr), sr);
    const s = oc.createBufferSource(); s.buffer = src; const gn = oc.createGain();
    if (fondus){ const fi=Math.min(1.5,dur/5), fo=Math.min(3,dur/4); gn.gain.setValueAtTime(0,0); gn.gain.linearRampToValueAtTime(g,fi); gn.gain.setValueAtTime(g,Math.max(fi,dur-fo)); gn.gain.linearRampToValueAtTime(0,dur); }
    else gn.gain.setValueAtTime(g,0);
    s.connect(gn); gn.connect(oc.destination); s.start(0, deb, dur);
    return await oc.startRendering();
  }
  async function enOpus(ab){
    const ch = ab.numberOfChannels, sr = ab.sampleRate;
    const cfg = {codec:"opus", sampleRate:sr, numberOfChannels:ch, bitrate: ch>1 ? 96000 : 64000};
    const ok = await AudioEncoder.isConfigSupported(cfg); if (!ok || !ok.supported) throw new Error("opus");
    const paquets = []; let desc = null, err = null;
    const enc = new AudioEncoder({ output:(c,meta)=>{ const b=new Uint8Array(c.byteLength); c.copyTo(b); paquets.push({t:c.timestamp, b});
        const d = meta && meta.decoderConfig && meta.decoderConfig.description; if (d && !desc) desc = (d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer,d.byteOffset,d.byteLength)).slice(); },
      error:e=>{ err=e; } });
    enc.configure(cfg);
    const N = 4800;
    for (let i=0;i<ab.length;i+=N){ const n=Math.min(N, ab.length-i); const plan=new Float32Array(n*ch);
      for (let c=0;c<ch;c++) plan.set(ab.getChannelData(c).subarray(i,i+n), c*n);
      const ad = new AudioData({format:"f32-planar", sampleRate:sr, numberOfFrames:n, numberOfChannels:ch, timestamp:Math.round(i/sr*1e6), data:plan});
      enc.encode(ad); ad.close();

    await enc.flush(); enc.close(); if (err) throw err;
    return webm(paquets, desc && desc.length>=19 ? desc : null, ch, sr, ab.duration);
  }
  /* secours sans WebCodecs : enregistrement en temps réel */
  async function enDirect(ab, onProg){
    const types = [["audio/webm;codecs=opus","video/webm"],["audio/webm","video/webm"],["audio/mp4","video/mp4"]];
    const t = window.MediaRecorder && types.find(([m])=>MediaRecorder.isTypeSupported(m)); if (!t) throw new Error("encodeur");
    const AC = window.AudioContext||window.webkitAudioContext; const ctx = new AC(); const dest = ctx.createMediaStreamDestination();
    const s = ctx.createBufferSource(); s.buffer = ab; s.connect(dest);
    const rec = new MediaRecorder(dest.stream, {mimeType:t[0], audioBitsPerSecond:96000}); const parts=[];
    rec.ondataavailable = e=>{ if(e.data.size) parts.push(e.data); };
    const fin = new Promise(r=>rec.onstop=r);
    rec.start(500); s.start(); const t0=performance.now();
    const tm = setInterval(()=>onProg && onProg(Math.min(1,(performance.now()-t0)/1000/ab.duration)),300);
    await new Promise(r=>s.onended=r); rec.stop(); await fin; clearInterval(tm); ctx.close();
    return new Blob(parts, {type:t[1]});
  }
  async function encode(ab, onProg){ if (window.AudioEncoder && window.AudioData){ try { return await enOpus(ab); } catch(e){ console.warn("webcodecs", e); } } return await enDirect(ab, onProg); }
  return { decode, rendre, encode };
})();

/* ---------- téléphone : lecture des cartes en direct avec la caméra (version autonome) ----------
   Les images sont analysées dans le téléphone puis oubliées : seuls les numéros de carte et les lettres lues sortent.
   Une caméra par activité (une seule filme à la fois) : le Bateau-école lit les lettres, les pavillons voient les cartes levées. */
function nouvelleCamera(opt){
  opt = Object.assign({bouton:"Lire les cartes en direct", note:"Pose le téléphone face à la classe : les cartes levées sont lues toutes seules.", attente:" · en attente d'une question", presence:false}, opt||{});
  let flux=null, video=null, marques=null, travail=null, det=null, actif=false, voulu=false, raf=0, dernier=0, tour=0, rapide=false, duree=40;
  let surLus=()=>{}, surVue=null, etatEl=null, choixEl=null, boutonEl=null, badgeEl=null, perimees=new Map();
  const vus = new Map(); // carte → {r:lettre, k:lectures, t:vue la dernière fois, c:coins}
  const CLE = "bateau-ecole-objectif";
  const lsG = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsS = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
  const etat = t => { if (etatEl) etatEl.textContent = t; };
  function nomObjectif(l){
    l = String(l||"");
    if (/ultra/i.test(l)) return "Ultra grand-angle (0,5×)";
    if (/télé|tele/i.test(l)) return "Téléobjectif";
    if (/double|dual|triple/i.test(l)) return "Automatique";
    if (/avant|front/i.test(l)) return "Caméra avant";
    if (/arrière|back|rear/i.test(l)) return "Grand-angle (1×)";
    return l || "Caméra";
  }
  function monte(box, o){
    surLus = o.surCartes || surLus; surVue = o.surVue || null;
    box.innerHTML = `<div class="cam">
      <div class="cam-vue" hidden><video playsinline muted autoplay></video><canvas class="cam-marques"></canvas><div class="cam-badge" hidden aria-live="polite"></div></div>
      <div class="cam-bar"><button class="btn prim cam-go">${opt.bouton}</button>
        <select class="cam-obj" aria-label="Objectif" hidden></select></div>
      <div class="note cam-etat" role="status">${opt.note}</div></div>`;
    video = box.querySelector("video"); marques = box.querySelector(".cam-marques"); travail = document.createElement("canvas");
    etatEl = box.querySelector(".cam-etat"); choixEl = box.querySelector(".cam-obj"); boutonEl = box.querySelector(".cam-go"); badgeEl = box.querySelector(".cam-badge");
    if (opt.id) boutonEl.id = opt.id;
    boutonEl.onclick = ()=>{ actif ? (voulu=false, arrete()) : (voulu=true, demarre()); };
    choixEl.onchange = ()=>{ lsS(CLE, choixEl.value); arrete(); demarre(); };
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden"){ if (actif) arrete(true); } else if (voulu && !actif) demarre(); });
  }
  async function demarre(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ etat("La caméra en direct n'est pas disponible ici : utilise la photo."); return; }
    const id = lsG(CLE), taille = {width:{ideal:1920}, height:{ideal:1080}};
    etat("Ouverture de la caméra…");
    try { flux = await navigator.mediaDevices.getUserMedia({audio:false, video: id ? Object.assign({deviceId:{exact:id}}, taille) : Object.assign({facingMode:{ideal:"environment"}}, taille)}); }
    catch(e){ if (id){ lsS(CLE, null); return demarre(); }
      voulu = false; etat(e && e.name==="NotAllowedError" ? "L'accès à la caméra est refusé : autorise-le dans les Réglages de l'iPhone › Bateau-école." : "Impossible d'ouvrir la caméra."); return; }

    if (!det) det = new AR.Detector({dictionaryName:"CARTES40", maxHammingDistance:2});
    actif = true; vus.clear(); perimees.clear();
    video.parentElement.hidden = false; boutonEl.textContent = "Arrêter la caméra"; boutonEl.classList.remove("prim"); boutonEl.classList.add("petit");
    Autonome.eveille(true); objectifs(); boucle(); if (opt.surEtat) opt.surEtat(true);
  }
  function arrete(pause){
    actif = false; cancelAnimationFrame(raf);
    if (flux) flux.getTracks().forEach(t=>t.stop()); flux = null;
    if (video){ video.srcObject = null; video.parentElement.hidden = true; }
    if (boutonEl){ boutonEl.textContent = opt.bouton; boutonEl.classList.add("prim"); boutonEl.classList.remove("petit"); }
    Autonome.eveille(false); vus.clear(); if (opt.surEtat) opt.surEtat(false);
    if (!pause) etat("Caméra arrêtée.");
  }
  async function objectifs(){
    try {
      const l = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput" && !/avant|front/i.test(d.label));
      const cur = flux && flux.getVideoTracks()[0] && flux.getVideoTracks()[0].getSettings().deviceId;
      if (l.length < 2){ choixEl.hidden = true; return; }
      choixEl.innerHTML = l.map(d=>`<option value="${esc(d.deviceId)}" ${d.deviceId===cur?"selected":""}>${esc(nomObjectif(d.label))}</option>`).join("");
      choixEl.hidden = false;
    } catch(e){ choixEl.hidden = true; }
  }
  function boucle(){
    if (!actif) return;
    raf = requestAnimationFrame(boucle);
    const now = performance.now(), periode = rapide ? Math.max(140, duree*2.5) : 900;
    if (now-dernier < periode || video.readyState < 2 || !video.videoWidth) return;
    dernier = now; analyse(periode);
  }
  function analyse(periode){
    const vw = video.videoWidth, vh = video.videoHeight;
    const cote = (tour++ % 2) ? 1000 : 1920, k = Math.min(1, cote/Math.max(vw,vh)); // une image fine, une image réduite : proches et lointaines
    const w = Math.round(vw*k), h = Math.round(vh*k);

    const g = travail.getContext("2d", {willReadFrequently:true}); g.drawImage(video, 0, 0, w, h);
    const t0 = performance.now(); let ms = [];
    try { ms = det.detect(g.getImageData(0, 0, w, h)); } catch(e){}
    duree = duree*.8 + (performance.now()-t0)*.2;
    const t = Date.now(), trouve = {};
    ms.forEach(m=>{ const n = m.id+1; if (n>NB_CARTES) return; const r = reponseCarte(m);
      const v = vus.get(n) || {k:0}; if (v.r===r || opt.presence) v.k++; else v.k = 1; v.r = r; v.t = t; v.c = m.corners.map(p=>({x:p.x/k, y:p.y/k})); vus.set(n, v); });
    vus.forEach((v,n)=>{ if (t-v.t > 1600){ vus.delete(n); perimees.delete(n); return; }
      const p = perimees.get(n); // carte encore levée depuis la question d'avant : on attend qu'elle bouge
      if (p && (p.r!==v.r || t-p.t > 4500)) perimees.delete(n);
      if (v.k>=2 && !perimees.has(n)) trouve[n] = v.r; });
    dessine(vw, vh);
    const nb = Object.keys(trouve).length;
    if (nb) surLus(trouve);
    if (surVue) surVue(vus, t);
    etat(`${vus.size} carte${vus.size>1?"s":""} en vue${rapide?"":opt.attente} · ${Math.max(1, Math.round(1000/periode))} image${periode<500?"s":""}/s`);
  }
  function dessine(vw, vh){
    if (marques.width!==vw || marques.height!==vh){ marques.width = vw; marques.height = vh; }
    const g = marques.getContext("2d"); g.clearRect(0, 0, vw, vh);
    const e = Math.max(2, vw/480);
    vus.forEach((v,n)=>{ const vieux = perimees.has(n) || v.k<2 || (opt.gris && opt.gris(n, v)), coul = vieux ? "#9AA9B4" : "#2F9E5B";
      g.strokeStyle = coul; g.lineWidth = e*1.5; g.beginPath(); v.c.forEach((p,i)=>i ? g.lineTo(p.x,p.y) : g.moveTo(p.x,p.y)); g.closePath(); g.stroke();
      const cx = v.c.reduce((a,p)=>a+p.x,0)/4, cy = v.c.reduce((a,p)=>a+p.y,0)/4, r = e*9;
      g.fillStyle = coul; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
      g.fillStyle = "#fff"; g.font = `700 ${Math.round(r)}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(opt.presence ? String(n) : n+" "+v.r, cx, cy); });
  }
  return { monte,
    /* question ouverte : lecture rapide ; nouvelle question : les cartes encore levées ne comptent qu'une fois bougées */
    question(ouverte, nouvelle){ rapide = !!ouverte; if (nouvelle){ const t = Date.now(); perimees = new Map(); vus.forEach((v,n)=>perimees.set(n, {r:v.r, t})); } },
    oublie(){ vus.clear(); perimees.clear(); },
    /* une autre activité prend la caméra (ou on quitte l'écran) : elle s'éteint et ne se rallume plus toute seule */
    coupe(){ const v = voulu; voulu = false; if (actif) arrete(true); return v; },
    lance(){ voulu = true; if (!actif) demarre(); },
    /* le compteur posé sur l'image (« 18 / 21 », vert quand toutes les cartes sont lues) */

    actif:()=>actif };
}

  #scr-tel{display:grid;max-width:none;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start;grid-auto-flow:row dense}
  #scr-tel > header,#t-auto,#t-rappel,#t-tele,#t-pied{grid-column:1/-1}
  #t-cam{grid-column:1;grid-row:span 4}
  #scr-tel .tel-q,#scr-tel .tel-res,#scr-tel .tel-actions,#scr-tel .photo-btn{grid-column:2}
}
.aut-reussi{justify-items:center;text-align:center;padding:26px 18px 20px}
.aut-reussi h2{font-size:1.7rem}
.aut-reussi .aut-boutons{width:100%}
.aut-coche svg{width:84px;height:84px;display:block}
.aut-coche circle{fill:#E3F4E9;stroke:var(--ok);stroke-width:3}
.aut-coche path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:aut-coche .5s .15s ease forwards}
@keyframes aut-coche{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.aut-etat.attente::before{animation:none}.aut-coche path{animation:none;stroke-dashoffset:0}}`;
  document.head.appendChild(st);
  const g = document.querySelector("#go-tel span"); if (g) g.textContent = "Pour lire les cartes-réponses des élèves, en direct avec la caméra.";
  const voile = html => { const d = document.createElement("div"); d.className = "aut-voile"; d.innerHTML = `<div class="aut-fenetre" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(d); return d; };
  const nomReseau = a => /^bridge/.test(a.nom) ? "au partage de connexion de ce téléphone" : "au même Wi-Fi";
  const message = (titre, texte) => { const d = voile(`<h2>${titre}</h2><p>${texte}</p><div class="aut-boutons" style="grid-template-columns:1fr"><button class="btn prim">OK</button></div>`); d.querySelector("button").onclick = ()=>d.remove(); };

  /* ---------- téléphone : un nouvel ordinateur demande à afficher le jeu ---------- */
  function accord(ip){
    return new Promise(ok=>{
      const d = voile(`<h2>Afficher le jeu sur cet ordinateur ?</h2>
        <p>Un ordinateur du réseau${ip?` (adresse ${esc(ip)})`:""} demande à ouvrir le Bateau-école. Accepte seulement si c'est l'ordinateur de ta classe.</p>
        <div class="aut-boutons"><button class="btn" data-r="non">Refuser</button><button class="btn prim" data-r="oui">Accepter</button></div>`);
      d.addEventListener("click", e=>{ const b = e.target.closest("[data-r]"); if (!b) return; d.remove(); ok(b.dataset.r==="oui"); });
    });
  }
  if (SRV) SRV.surDemande(accord);

  /* ---------- téléphone : lire le QR code affiché sur l'écran de la classe ---------- */
  function codeDans(txt){ const m = /(?:lier\/|lien=)([0-9A-Za-z-]{10,13})/.exec(txt||""); return L.normalise(m ? m[1] : txt); }
  async function scanne(retour){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ message("Caméra indisponible", "Tape plutôt le code de la classe affiché sur l'écran (Réglages › Téléphone)."); return; }
    const d = document.createElement("div"); d.className = "aut-scan";
    d.innerHTML = `<video playsinline muted autoplay></video><div class="viseur"></div>
      <div class="bas"><p id="aut-scan-msg">Vise le QR code affiché sur l'écran de la classe.</p><button class="btn">Annuler</button></div>`;
    document.body.appendChild(d);
    const video = d.querySelector("video"), msg = d.querySelector("#aut-scan-msg"), cv = document.createElement("canvas");
    let flux = null, fini = false;
    const ferme = () => { fini = true; if (flux) flux.getTracks().forEach(t=>t.stop()); d.remove(); };
    d.querySelector("button").onclick = ferme;
    try { flux = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}}); }
    catch(e){ msg.textContent = "L'accès à la caméra est refusé : autorise-le dans les Réglages de l'iPhone › Bateau-école."; return; }
    if (fini){ flux.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = flux; try { await video.play(); } catch(e){}
    const tour = async () => {
      if (fini) return;
      if (video.readyState>=2 && video.videoWidth){
        const k = Math.min(1, 720/Math.max(video.videoWidth, video.videoHeight)), w = Math.round(video.videoWidth*k), h = Math.round(video.videoHeight*k);
        cv.width = w; cv.height = h; const gc = cv.getContext("2d", {willReadFrequently:true}); gc.drawImage(video, 0, 0, w, h);
        const r = LecteurQR(gc.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:"dontInvert"});
        const c = r && codeDans(r.data);
        if (c){ fini = true; msg.textContent = "QR code lu : connexion à l'écran de la classe…"; await L.fixe(c); setTimeout(()=>{ ferme(); rouvre(retour); }, 500); return; }
        if (r && r.data) msg.textContent = "Ce QR code n'est pas celui du Bateau-école.";
      }
      setTimeout(tour, 160);
    };
    tour();
  }

  /* ---------- téléphone : « Afficher le jeu sur l'ordinateur » ---------- */
  let majServeur = null, finPairs = null;
  function relier(box, o){
    o = o || {};
    if (majServeur){ majServeur(); majServeur = null; }
    if (finPairs){ finPairs(); finPairs = null; }
    box.innerHTML = `<div class="aut-carte" id="aut-relier">
      <h2>Afficher le jeu sur l'ordinateur de la classe</h2>
      ${o.attente ? `<p class="aut-etat attente" id="aut-attente">Connexion à l'écran de la classe…</p>` : ""}
      <div class="aut-voie"><h3><i>1</i>Avec internet</h3>
        <p>Sur l'ordinateur, ouvre :</p><div class="aut-adresse">${esc(WEB_COURT)}</div>
        <p>puis scanne le QR code qui s'affiche à l'écran.</p>
        <div class="aut-boutons"><button class="btn prim" id="aut-scan">Scanner le QR code</button>
          <button class="btn" id="aut-envoi">Envoyer le lien à l'ordinateur</button></div>
        <p class="aut-note">Le lien envoyé (par mail, par exemple) relie l'écran tout seul, sans QR code.</p>
        <details class="aut-code"><summary>Taper le code de la classe à la place</summary>
          <div class="ligne"><input class="lier-saisie" id="t-code" placeholder="XXXXX-XXXXX" maxlength="13" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Code de la classe"><button class="btn mer" id="t-code-ok">Relier</button></div>
          <p class="aut-note" id="t-code-msg" role="status">Le code est écrit sous le QR code, sur l'écran de la classe.</p></details></div>
      ${SRV ? `<div class="aut-voie"><h3><i>2</i>Sans internet</h3>
        <p>Mets l'ordinateur sur le même Wi-Fi que ce téléphone, ou sur son partage de connexion.</p>
        <div id="aut-wifi"></div></div>` : ""}
      ${o.fermer ? `<button class="btn petit" id="aut-fermer" style="justify-self:end">Fermer</button>` : ""}</div>`;
    box.querySelector("#aut-scan").onclick = ()=>scanne(o.retour);
    const tape = async ()=>{ const c = L.normalise(box.querySelector("#t-code").value);
      if (!c){ box.querySelector("#t-code-msg").textContent = "Le code fait 10 caractères, par exemple 7K2QM-9XA3F."; return; }
      await L.fixe(c); rouvre(o.retour); };
    box.querySelector("#t-code-ok").onclick = tape;
    box.querySelector("#t-code").onkeydown = e=>{ if (e.key==="Enter") tape(); };
    box.querySelector("#aut-envoi").onclick = ()=>envoieLien(o.retour);
    if (o.fermer) box.querySelector("#aut-fermer").onclick = o.fermer;
    if (SRV){
      const zone = box.querySelector("#aut-wifi");
      const dessine = inf => {
        if (!zone.isConnected) return;
        if (!inf.actif){ zone.innerHTML = `<div class="aut-boutons"><button class="btn mer" id="aut-wifi-go">Afficher par le Wi-Fi</button></div>`;
          zone.querySelector("#aut-wifi-go").onclick = ()=>activeWifi(o.retour); return; }
        const a = (inf.adresses||[])[0];
        if (!a){ zone.innerHTML = `<p class="aut-etat">Ce téléphone n'est sur aucun Wi-Fi.</p><p class="aut-note">Active le Wi-Fi, ou le partage de connexion (Réglages de l'iPhone › Partage de connexion), puis reviens ici.</p>`; return; }
        const adr = a.ip + (inf.http && inf.http!==80 ? ":"+inf.http : "");
        zone.innerHTML = `<p>Sur l'ordinateur, relié ${nomReseau(a)}, ouvre :</p><div class="aut-adresse">${esc(adr)}</div>
          <p class="aut-etat ${inf.clients?"ok":"attente"}">${inf.clients ? (inf.clients>1 ? inf.clients+" ordinateurs affichent le jeu" : "Un ordinateur affiche le jeu") : "En attente de l'ordinateur…"}</p>
          <p class="aut-note">Garde l'appli ouverte pendant le rituel : c'est elle qui fait marcher le jeu sur l'ordinateur.</p>
          <button class="btn petit" id="aut-wifi-stop" style="justify-self:start">Arrêter l'affichage par le Wi-Fi</button>`;
        zone.querySelector("#aut-wifi-stop").onclick = async ()=>{ await SRV.arrete(); };
      };
      majServeur = SRV.surMaj(dessine); dessine(SRV.infos()); SRV.rafraichit();
    }
    // l'ordinateur se relie : la validation s'affiche ici, sans revenir à l'accueil
    useCap("room").then(room=>{ if (!room || !box.isConnected) return;
      let avant = null, f = null;
      f = room.onPeers(ch=>{ if (!box.isConnected){ if (f) f(); return; }
        const lie = ch.peers.some(p=>!p.isMe && p.presence && p.presence.role==="tbi");
        if (avant===null){ avant = lie; if (lie && !o.attente) return; }
        if (lie && (!avant || o.attente)){ if (f) f(); finPairs = null; reussi(box, o); return; }
        avant = lie; });
      finPairs = f; });
    if (o.attente) setTimeout(()=>{ const a = box.querySelector("#aut-attente"); if (a) a.textContent = "Toujours en attente… Vérifie que l'ordinateur affiche bien le jeu, et qu'il est connecté à internet."; }, 15000);
  }
  function reussi(box, o){
    if (majServeur){ majServeur(); majServeur = null; }
    const inf = SRV && SRV.infos ? SRV.infos() : null;
    box.innerHTML = `<div class="aut-carte aut-reussi" role="status">
      <div class="aut-coche" aria-hidden="true"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
      <h2>C'est relié !</h2>
      <p>Le jeu s'affiche sur l'ordinateur de la classe. Ce téléphone lance les activités et lit les cartes.</p>
      ${inf && inf.actif && inf.clients ? `<p class="aut-note">Par le Wi-Fi de ce téléphone : garde l'appli ouverte pendant l'activité.</p>` : ""}
      <div class="aut-boutons"><button class="btn prim" id="aut-ok">${esc(o.suiteTexte || "Continuer")}</button></div></div>`;
    box.querySelector("#aut-ok").onclick = ()=>{ if (o.suite) o.suite(); else if (o.fermer) o.fermer(); else if (window.Accueil) Accueil.accueilTel(); };
    try { if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
  }
  async function envoieLien(retour){
    const avant = L.code(), code = await L.assure(), url = L.lienWeb(code);
    const P = Autonome.partage;
    try {
      if (P) await P.share({title:"Le Bateau-école", text:"Ouvre ce lien sur l'ordinateur de la classe :", url, dialogTitle:"Envoyer le lien"});
      else if (navigator.share) await navigator.share({title:"Le Bateau-école", url});
      else { await navigator.clipboard.writeText(url); message("Lien copié", "Colle-le dans le navigateur de l'ordinateur de la classe."); }
    } catch(e){}
    if (!avant) rouvre(retour); // code tout neuf : on se branche dessus
  }
  async function activeWifi(retour){
    const avant = L.code(); await L.assure(); await SRV.demarre();
    if (!avant) rouvre(retour);
  }
  /* recharger en gardant le panneau ouvert (la liaison démarre avec le nouveau code) ; retour : l'écran où revenir une fois relié */
  function rouvre(retour){ try { sessionStorage.setItem("bateau-ecole-relier", retour || "accueil"); } catch(e){} location.reload(); }
  function aRouvrir(){ try { const v = sessionStorage.getItem("bateau-ecole-relier"); sessionStorage.removeItem("bateau-ecole-relier"); return v ? (v==="1" ? "accueil" : v) : ""; } catch(e){ return ""; } }

  /* ---------- téléphone : lecture des cartes (Bateau-école) : compteur sur l'image, prénoms pas encore lus ---------- */
  function scan(cs, rep, TQ){
    const res = document.querySelector("#scr-tel .tel-res"); if (!res) return;
    let m = document.getElementById("t-manque");
    if (!m){ m = document.createElement("p"); m.id = "t-manque"; m.className = "tel-manque"; m.setAttribute("aria-live", "polite"); }
    const vue = document.querySelector("#t-cam .cam-vue"); // juste sous l'image de la caméra
    if (vue && m.previousElementSibling!==vue) vue.after(m); else if (!vue && !m.isConnected) res.firstElementChild.after(m);
    const tq = document.querySelector("#scr-tel .tel-q"); if (tq) tq.classList.toggle("vide", !(TQ && TQ.qid) && !!window.Accueil);
    const manque = cs.filter(([n])=>!rep[n]), lus = cs.length-manque.length, q = TQ && TQ.qid, bonne = q && TQ.bonne;
    const nom = ([n,p]) => esc(p || "carte "+n);
    if (bonne){ const ok = cs.filter(([n])=>rep[n]===bonne).length;
      m.innerHTML = `<b>Réponse ${esc(bonne)}</b> · ${ok} bonne${ok>1?"s":""} réponse${ok>1?"s":""} sur ${lus} carte${lus>1?"s":""} lue${lus>1?"s":""}`; }
    else if (!cs.length) m.innerHTML = "";
    else if (!manque.length) m.innerHTML = `<b class="ok">Toutes les cartes sont lues ✓</b>`;
    else if (!lus) m.innerHTML = q && TQ.open ? "Levez les cartes !" : "Pas de question en cours : lève une carte devant le téléphone pour l'essayer.";
    else m.innerHTML = `<b>Pas encore lue${manque.length>1?"s":""} (${manque.length}) :</b> ${manque.slice(0,16).map(nom).join(", ")}${manque.length>16 ? "…" : ""}`;
    if (window.CameraDirect) CameraDirect.badge(cs.length ? `${lus}<small>/ ${cs.length}</small>` : "", cs.length && !manque.length ? "ok" : "");
  }
  /* téléphone relié mais écran absent : rappel ; pied de page avec le code */
  function rappel(box, visible, ouvrir){
    if (!visible){ box.innerHTML = ""; return; }
    if (box.firstElementChild) return;
    box.innerHTML = `<div class="aut-rappel"><span><b>L'écran de la classe n'est pas relié.</b></span><button class="btn mer petit" id="aut-rappel-go">Afficher le jeu sur l'ordinateur</button></div>`;
    box.querySelector("#aut-rappel-go").onclick = ouvrir;
  }
  function piedTel(box, ouvrir){
    box.innerHTML = `<button class="btn petit" id="t-afficher">Afficher le jeu sur un ordinateur</button>
      <span class="note">Code de la classe : <b class="num">${esc(L.code()||"")}</b></span>
      <button class="btn petit" id="t-oublie">Relier un autre écran</button>`;
    box.querySelector("#t-afficher").onclick = ouvrir;
    const b = box.querySelector("#t-oublie");
    b.onclick = async ()=>{ if (!b.dataset.sur){ b.dataset.sur = 1; b.textContent = "Confirmer : oublier cet écran"; b.classList.add("prim"); return; } if (SRV) await SRV.arrete(); await L.oublie(); location.reload(); };
  }

  /* ---------- écran de la classe ---------- */
  let telVuUneFois = (()=>{ try { return localStorage.getItem("bateau-ecole-tel-vu")==="1"; } catch(e){ return false; } })();
  function tbi(){
    const stage = document.body;
    if (Autonome.LOCAL) return tbiLocal(stage);
    if (window.Accueil) return; // l'accueil de l'écran de la classe montre le QR code
    let carte = null;
    const montre = on => {
      if (on && !carte && !telVuUneFois && L.code()){ carte = document.createElement("div"); carte.className = "aut-accueil";
        carte.innerHTML = `<b>Relie ton téléphone</b><div class="lier-qr">${L.qr(null, 240)}</div>
          <p>Dans l'appli Bateau-école du téléphone : « Scanner le QR code », puis vise ce code.</p><button class="btn petit">Plus tard</button>`;
        carte.querySelector("button").onclick = ()=>{ carte.remove(); carte = null; telVuUneFois = true; };
        stage.appendChild(carte); }
      if (!on && carte){ carte.remove(); carte = null; }
    };
    useCap("room").then(r=>{ if (!r) return;
      r.onPeers(ch=>{ const tel = ch.peers.some(p=>p.presence && p.presence.role==="scanner");
        if (tel && !telVuUneFois){ telVuUneFois = true; try { localStorage.setItem("bateau-ecole-tel-vu","1"); } catch(e){} }
        montre(!tel); }); });
  }
  /* jeu servi par le téléphone : attendre l'accord, puis copier tout le jeu dans le navigateur (il marchera même si le téléphone s'éloigne) */
  function tbiLocal(stage){
    const T = Autonome.LienTel; let d = null, bandeau = null, charge = false;
    const dessine = e => {
      if (e==="accepte" || e==="reconnexion"){ if (d){ d.remove(); d = null; } if (bandeau){ bandeau.remove(); bandeau = null; } if (!charge){ charge = true; precharge(); } return; }
      if (e==="perdu"){ if (!bandeau){ bandeau = document.createElement("div"); bandeau.className = "aut-bandeau"; bandeau.textContent = "Le téléphone est hors de portée : garde l'appli Bateau-école ouverte."; stage.appendChild(bandeau); } return; }
      if (!d) d = voile("");
      d.firstElementChild.innerHTML = e==="refuse"
        ? `<h2>Accès refusé</h2><p>Le téléphone a refusé d'afficher le jeu sur cet ordinateur.</p><div class="aut-boutons" style="grid-template-columns:1fr"><button class="btn prim">Demander à nouveau</button></div>`
        : `<h2>Sur le téléphone, touche « Accepter »</h2><p>Le téléphone demande s'il peut afficher le jeu sur cet ordinateur.</p><p class="aut-etat attente">En attente de la réponse…</p>`;
      const b = d.querySelector("button"); if (b) b.onclick = ()=>{ T.reessaie(); dessine("attente"); };
    };
    T.surEtat(dessine); dessine(T.etat());
  }
  async function precharge(){
    try { const l = await (await fetch("fichiers.json", {cache:"no-store"})).json();
      let i = 0; const suivant = async ()=>{ while (i < l.length){ const f = l[i++]; try { await (await fetch(f)).arrayBuffer(); } catch(e){} } };
      await Promise.all([suivant(), suivant()]);
    } catch(e){}
  }

  /* ---------- écran de la classe : Réglages › Téléphone ---------- */
  let suivi = null;
  async function rendTel(c){
    clearInterval(suivi);
    c.innerHTML = `<p class="note">Préparation…</p>`;
    await useCap("room");
    const code = L.code();
    if (!code){ c.innerHTML = `<p class="note">${Autonome.LOCAL ? "Accepte d'abord cet ordinateur sur le téléphone." : "La liaison n'a pas pu démarrer sur cet appareil."}</p>`; return; }
    if (Autonome.LOCAL){
      c.innerHTML = `<h3>Jeu affiché depuis le téléphone</h3><p class="note">Cet ordinateur reçoit le jeu par le Wi-Fi, depuis l'appli Bateau-école du téléphone (sans internet). Garde l'appli ouverte pendant le rituel.</p>
        <p class="aut-etat" id="lier-etat"></p>`;
    } else {
      c.innerHTML = `<div class="lier">
        <div class="lier-qr">${L.qr(code, 280)}</div>
        <div class="lier-txt"><p style="margin:0"><b>Relier le téléphone</b></p>
          <p style="margin:0">Dans l'appli Bateau-école du téléphone, touche « Scanner le QR code », puis vise ce code.</p>
          <div class="lier-code num">${esc(code)}</div>
          <p class="aut-etat" id="lier-etat"></p></div></div>
        <h3>Ouvrir le jeu sur un autre ordinateur</h3><p class="note">Ce lien ouvre le jeu déjà relié au téléphone. Garde-le en favori si l'ordinateur efface tout chaque soir.</p>
        <input class="lier-lien" id="lier-lien" readonly value="${esc(L.lienWeb(code))}" aria-label="Lien du jeu">
        <h3>Sans internet</h3><p class="note">Sur le téléphone, touche « Afficher le jeu sur un ordinateur », puis « Afficher par le Wi-Fi » : l'ordinateur ouvre l'adresse affichée par le téléphone.</p>
        <h3>Code de la classe</h3><p class="note">Si cet ordinateur a perdu la liaison, tape le code affiché en bas de l'écran du téléphone.</p>
        <div class="ligne"><input class="lier-saisie" id="lier-saisie" placeholder="XXXXX-XXXXX" maxlength="13" autocomplete="off" spellcheck="false" aria-label="Code de la classe"><button class="btn mer" id="lier-ok">Utiliser ce code</button><span class="note" id="lier-msg" role="status"></span></div>
        <p class="note">Ou crée un nouveau code : le téléphone devra être relié à nouveau. <button class="btn petit" id="lier-neuf">Nouveau code</button></p>`;
    }
    c.insertAdjacentHTML("beforeend", `<details class="lier"><summary>Détails de la connexion</summary><p class="note" id="lier-relais"></p></details>`);
    const maj = ()=>{ const e = c.querySelector("#lier-etat"); if (!e){ clearInterval(suivi); return; }
      const tel = L.pairs().some(p=>p.presence && p.presence.role==="scanner"), r = L.etat();
      e.textContent = tel ? "Téléphone relié" : "En attente du téléphone…"; e.className = "aut-etat " + (tel ? "ok" : "attente");
      const d = c.querySelector("#lier-relais"); if (d) d.textContent = r.map(x=>(x.ok?"✓ ":"✗ ")+x.nom).join(" · "); };
    maj(); suivi = setInterval(maj, 1500);
    c.onclick = async e=>{
      if (e.target.id==="lier-ok"){ const v = L.normalise(c.querySelector("#lier-saisie").value);
        if (!v){ c.querySelector("#lier-msg").textContent = "Le code fait 10 caractères, par exemple 7K2QM-9XA3F."; return; }
        await L.fixe(v); location.reload(); }
      if (e.target.id==="lier-neuf"){ const b = e.target; if (!b.dataset.sur){ b.dataset.sur = 1; b.textContent = "Confirmer"; b.classList.add("prim"); return; }
        await L.nouveau(); location.reload(); }
      if (e.target.id==="lier-lien") e.target.select();
    };
    c.oninput = c.onchange = null;
  }
  return { relier, rappel, piedTel, scanne, accord, tbi, rendTel, aRouvrir, scan };
})();
function rendTel(c){ return EcransAutonome.rendTel(c); }
window.EcransAutonome = EcransAutonome;

/* ---------- version autonome : la classe (élèves, cartes-réponses, absences du jour) ----------
   Commune à toutes les activités et synchronisée entre le téléphone et l'écran de la classe (document « classe/actuelle »).
   Le Bateau-école y lit ses élèves : S.eleves en est une copie. Chaque élève garde toujours le même numéro de carte. */
const Classe = (() => {
  const DOC = "classe/actuelle", MAX = NB_CARTES;
  const NIVEAUX = ["CP","CE1","CE2","CM1","CM2","Autre"];
  const deux = x => String(x).padStart(2,"0");
  const aujourdhui = () => { const d = new Date(); return d.getFullYear()+"-"+deux(d.getMonth()+1)+"-"+deux(d.getDate()); };
  let c = null, db = null, pret = null, tEcrit = null;
  const ecoutes = new Set();
  const vide = () => ({v:1, id:"c"+Autonome.rid(6), nom:"", niveau:"", maj:0,
    eleves:Array.from({length:MAX},(_,i)=>({n:i+1, prenom:"", actif:false})), absents:{jour:"", n:[]}});
  function propre(o){
    const d = vide(); if (!o || typeof o!=="object") return d;
    const r = {v:1, id:typeof o.id==="string" && o.id ? o.id : d.id, nom:String(o.nom||"").slice(0,60), niveau:NIVEAUX.includes(o.niveau) ? o.niveau : "",
      maj:+o.maj||0, eleves:d.eleves, absents:{jour:"", n:[]}};
    (Array.isArray(o.eleves) ? o.eleves : []).forEach(e=>{ const n = +(e && e.n); if (n>=1 && n<=MAX) r.eleves[n-1] = {n, prenom:String(e.prenom||"").trim().slice(0,24), actif:!!e.actif}; });
    if (o.absents && typeof o.absents.jour==="string") r.absents = {jour:o.absents.jour, n:(Array.isArray(o.absents.n) ? o.absents.n : []).map(Number).filter(n=>n>=1 && n<=MAX)};
    return r;
  }
  const annonce = origine => ecoutes.forEach(f=>{ try { f(c, origine); } catch(e){ console.error(e); } });
  async function init(){
    if (pret) return pret;
    pret = (async()=>{
      db = await useCap("db");
      const s = await db.doc(DOC).get();
      c = s.exists ? propre(s.data()) : null;
      db.doc(DOC).onSnapshot(snap=>{ if (!snap.distant) return; c = propre(snap.data()); annonce("distant"); });
      return c;
    })();
    return pret;
  }
  function enregistre(){
    c.maj = Date.now(); const copie = JSON.parse(JSON.stringify(c));
    clearTimeout(tEcrit); tEcrit = setTimeout(()=>{ if (db) db.doc(DOC).set(copie).catch(e=>console.warn("classe", e)); }, 300);
    annonce("local");
  }
  function modifie(fn){ if (!c) c = vide(); fn(c); enregistre(); }
  /* la classe d'un voyage du Bateau-école (copie de sauvegarde, ou premier lancement de l'écran de la classe) */
  function depuisEtat(S, maj){ const k = vide(); (S && Array.isArray(S.eleves) ? S.eleves : []).forEach(e=>{ const n = +e.n; if (n>=1 && n<=MAX) k.eleves[n-1] = {n, prenom:String(e.prenom||"").trim(), actif:!!e.actif}; });
    k.maj = maj || 0; return k; }

  /* ---------- listes collées (un prénom par ligne, tableur, ONDE…) ---------- */
  const joli = p => p.toLocaleLowerCase("fr").replace(/(^|[\s'-])(\p{L})/gu, (m,a,b)=>a+b.toLocaleUpperCase("fr"));
  const majuscules = w => w.length>1 && w===w.toLocaleUpperCase("fr") && /\p{L}/u.test(w);
  function lisListe(t){
    let lignes = String(t||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
    if (lignes.length===1 && /,/.test(lignes[0]) && !/[;\t]/.test(lignes[0])) lignes = lignes[0].split(",").map(x=>x.trim()).filter(Boolean);
    let col = -1;
    const champs = l => l.split(/\t|;/).map(x=>x.replace(/^"|"$/g,"").trim());
    if (lignes.length){ const t0 = champs(lignes[0]).map(x=>x.toLocaleLowerCase("fr").normalize("NFD").replace(/\p{M}/gu,""));
      col = t0.findIndex(x=>/^prenom/.test(x)); if (col>=0 || t0.some(x=>/^nom/.test(x))) lignes = lignes.slice(1); }
    const res = [];
    lignes.forEach(l=>{
      const f = champs(l).filter(Boolean); if (!f.length) return;
      let prenom = "", nom = "";
      if (col>=0 && f[col]) { prenom = f[col]; nom = f.find((x,i)=>i!==col && /\p{L}/u.test(x)) || ""; }
      else if (f.length>1){ const i = f.findIndex(x=>!majuscules(x)); prenom = f[i>=0?i:1] || f[0]; nom = f.find(x=>x!==prenom) || ""; }
      else { const mots = f[0].split(/\s+/); const gros = mots.filter(majuscules), petits = mots.filter(w=>!majuscules(w));
        if (gros.length && petits.length){ prenom = petits.join(" "); nom = gros.join(" "); } else prenom = f[0]; }
      prenom = prenom.replace(/^\d+[.)-]?\s*/,"").replace(/\s+/g," ").trim();
      if (!/\p{L}/u.test(prenom)) return;
      res.push({prenom: prenom===prenom.toLocaleUpperCase("fr") || prenom===prenom.toLocaleLowerCase("fr") ? joli(prenom) : prenom, nom});
    });
    // deux fois le même prénom : on ajoute l'initiale du nom (comme « Ethan F. »)
    const compte = {}; res.forEach(r=>{ const k = r.prenom.toLocaleLowerCase("fr"); compte[k] = (compte[k]||0)+1; });
    const vus = {}; res.forEach(r=>{ const k = r.prenom.toLocaleLowerCase("fr"); if (compte[k]>1){ vus[k] = (vus[k]||0)+1; r.prenom += r.nom ? " "+r.nom.trim()[0].toLocaleUpperCase("fr")+"." : " "+vus[k]; } });
    return res.map(r=>r.prenom.slice(0,24));
  }
  function ajoute(prenoms){
    let mis = 0;
    modifie(k=>{ prenoms.forEach(p=>{ const e = k.eleves.find(x=>!x.actif && !x.prenom); if (e){ e.prenom = p; e.actif = true; mis++; } }); });
    return {mis, refus:prenoms.length-mis};
  }

  /* ---------- absences du jour ---------- */
  const absents = () => c && c.absents && c.absents.jour===aujourdhui() ? c.absents.n : [];
  function basculeAbsent(n){ modifie(k=>{ const l = k.absents.jour===aujourdhui() ? k.absents.n.slice() : []; const i = l.indexOf(n); if (i>=0) l.splice(i,1); else l.push(n); k.absents = {jour:aujourdhui(), n:l}; }); }
  window.absentAujourdhui = n => absents().includes(n);

  /* ---------- motif d'une carte (le marqueur ArUco lu par la caméra) ---------- */
  const bits = n => { const cd = AR.DICTIONARIES.CARTES40.codeList[n-1] || [0,0]; return cd.map(b=>b.toString(2).padStart(8,"0")).join(""); };
  function motif(n, taille){
    const cv = document.createElement("canvas"), px = taille||48, r = window.devicePixelRatio||1; cv.width = cv.height = Math.round(px*r);
    cv.style.width = cv.style.height = px+"px"; cv.className = "cl-motif"; cv.setAttribute("aria-hidden", "true");
    const g = cv.getContext("2d"), k = cv.width/6; g.fillStyle = "#000"; g.fillRect(0,0,cv.width,cv.width); g.fillStyle = "#fff";
    const b = bits(n); for (let i=0;i<4;i++) for (let j=0;j<4;j++) if (b[i*4+j]==="1") g.fillRect((j+1)*k, (i+1)*k, k+.5, k+.5);
    return cv;
  }

  /* ---------- cartes-réponses à imprimer (PDF A4, deux cartes A5 par page, comme outils/cartes_reponses.py) ---------- */
  function chargeScript(src){ return new Promise((ok, ko)=>{ if (window.jspdf) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ()=>ko(new Error("pdf")); document.head.appendChild(s); }); }
  async function pdf(liste){
    await chargeScript("vendor/jspdf.umd.min.js");
    const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
    const W = 210, H = 297, T = 120, k = T/6, gap = 6.5; // marqueur de 12 cm : les lettres restent loin du bord (marges des imprimantes)
    doc.setProperties({title:"Cartes-réponses"+(c && c.nom ? " — "+c.nom : "")});
    liste.forEach((e,i)=>{
      if (i && i%2===0) doc.addPage();
      const cx = W/2, cy = (i%2 ? H*3/4 : H/4), x0 = cx-T/2, y0 = cy-T/2, b = bits(e.n);
      doc.setFillColor(0,0,0); doc.rect(x0, y0, T, T, "F"); doc.setFillColor(255,255,255);
      for (let r=0;r<4;r++) for (let q=0;q<4;q++) if (b[r*4+q]==="1") doc.rect(x0+(q+1)*k, y0+(r+1)*k, k+.15, k+.15, "F");
      doc.setTextColor(60,60,60); doc.setFont("helvetica","bold"); doc.setFontSize(16);
      doc.text("A", cx, y0-gap, {align:"center", baseline:"middle"});
      doc.text("B", x0+T+gap, cy, {align:"center", baseline:"middle", angle:-90});
      doc.text("C", cx, y0+T+gap, {align:"center", baseline:"middle", angle:180});
      doc.text("D", x0-gap, cy, {align:"center", baseline:"middle", angle:90});
      const nom = (e.prenom||"").trim(), lab = e.n + (nom ? "  ·  "+nom : "");
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(90,90,90);
      doc.text(lab, x0, y0-gap-1, {baseline:"middle"});
      doc.text(lab, x0+T, y0+T+gap+1, {baseline:"middle", angle:180});
      if (i%2===0){ doc.setDrawColor(170,170,170); doc.setLineDashPattern([2,2.5],0); doc.line(8, H/2, W-8, H/2); doc.setLineDashPattern([],0); }
    });
    return doc.output("blob");
  }
  async function imprimeCartes(){
    const l = c ? c.eleves.filter(e=>e.actif) : [];
    const liste = l.length ? l : Array.from({length:25},(_,i)=>({n:i+1, prenom:""}));
    const blob = await pdf(liste);
    await Autonome.partageFichier("Cartes-réponses"+(c && c.nom ? " - "+c.nom : "")+".pdf", blob, "application/pdf");
  }

  /* ---------- sauvegarde de la classe (et du voyage) ---------- */
  async function exporte(){
    const v = await (await useCap("db")).doc("jeu/etat").get();
    const bateau = window.Accueil && Accueil.estEcran() && typeof S!=="undefined" && S.maj ? JSON.parse(JSON.stringify(S)) : (v.exists ? v.data() : null);
    const o = {format:"bateau-ecole/sauvegarde", version:1, date:new Date().toISOString(), classe:c, bateau};
    const nom = ("Classe "+(c && c.nom || "")).trim().replace(/[\\/:*?"<>|]/g,"-")+" - "+aujourdhui()+".json";
    await Autonome.partageFichier(nom, new Blob([JSON.stringify(o, null, 1)], {type:"application/json"}), "application/json");
  }
  function lit(texte){
    let o = null; try { o = JSON.parse(texte); } catch(e){}
    if (o && o.format==="bateau-ecole/sauvegarde") return {type:"sauvegarde", classe:o.classe ? propre(o.classe) : null, bateau:o.bateau && typeof o.bateau==="object" ? o.bateau : null};
    if (o && Array.isArray(o.eleves) && ("milles" in o || "questions" in o)) return {type:"bateau", classe:depuisEtat(o, Date.now()), bateau:o};
    if (o) return {type:"inconnu"};
    const l = lisListe(texte); return l.length ? {type:"liste", prenoms:l} : {type:"inconnu"};
  }
  /* applique une sauvegarde : la classe tout de suite, le voyage vers l'écran de la classe (qui remplacera le sien) */
  async function importe(r){
    if (r.classe){ const k = propre(r.classe); c = k; enregistre(); }
    if (r.prenoms) ajoute(r.prenoms);
    if (r.bateau){
      const b = JSON.parse(JSON.stringify(r.bateau)), dbx = await useCap("db"), v = await dbx.doc("jeu/etat").get();
      b.voyage = idVoyage(); b.remplace = (v.exists && v.data().voyage) || (typeof S!=="undefined" && S.voyage) || null; b.maj = Date.now();
      if (window.Accueil && Accueil.estEcran() && typeof recupereEtat==="function"){ recupereEtat(b); }
      else await dbx.doc("jeu/etat").set(b);
    }
  }
  function choisitFichier(){
    return new Promise(ok=>{ const i = document.createElement("input"); i.type = "file"; i.accept = ".json,.txt,.csv,application/json,text/plain,text/csv";
      i.onchange = ()=>{ const f = i.files && i.files[0]; if (!f){ ok(null); return; } const fr = new FileReader(); fr.onload = ()=>ok(String(fr.result||"")); fr.onerror = ()=>ok(null); fr.readAsText(f); };
      i.click(); });
  }

  /* ---------- l'écran de la classe suit la classe : le Bateau-école y prend ses élèves ---------- */
  function versJeu(){
    if (!c || typeof S==="undefined") return false;
    const avant = JSON.stringify(S.eleves), apres = JSON.stringify(c.eleves);
    if (avant===apres) return false;
    S.eleves = JSON.parse(apres); sauve(); return true;
  }

  return { init, get:()=>c, existe:()=>!!c, NIVEAUX, MAX, aujourdhui,
    surChange:f=>{ ecoutes.add(f); return ()=>ecoutes.delete(f); },
    cree(o){ c = propre(Object.assign(vide(), o||{})); enregistre(); },
    /* adopter une classe sans la dater (premier lancement de l'écran : elle ne doit pas écraser celle du téléphone) */
    adopte(k){ c = propre(k); if (db) db.doc(DOC).set(JSON.parse(JSON.stringify(c))).catch(()=>{}); annonce("local"); },
    modifie, ajoute, lisListe, basculeAbsent, absents, motif, pdf, imprimeCartes, exporte, lit, importe, choisitFichier, depuisEtat, versJeu,
    actifs:()=> c ? c.eleves.filter(e=>e.actif) : [],
    presents:()=> c ? c.eleves.filter(e=>e.actif && !absents().includes(e.n)) : [] };
})();
window.Classe = Classe;

   Écran de démarrage animé, accueil du téléphone (poste de pilotage de la maîtresse ou du maître), installation guidée,

   Première activité : le Bateau-école (lanceTBI / lanceTel, inchangés). */

  };
  const st = document.createElement("style");
  st.textContent = `

      if (v.dataset.v==="cartes") imprime(v);
    };
    s.querySelector("#aa-lire").onclick = ()=>ouvreActivite("bateau");
    etatBateau().then(t=>{ const e = s.querySelector('[data-etat="bateau"]'); if (e) e.textContent = t; });
    dessineEcran(); if (window.Pavillons) Pavillons.bandeau();
  }
  let tbiVu = false, questionOuverte = false;
  function dessineEcran(){
    const z = document.getElementById("aa-ecran-etat"); if (!z) return;
    z.innerHTML = tbiVu
      ? `<p class="aut-etat ok">L'écran de la classe est relié</p>`
      : `<p class="aut-etat">L'écran de la classe n'est pas relié</p><button class="btn mer" id="aa-relier">Afficher le jeu sur l'ordinateur</button>`;
    const b = z.querySelector("#aa-relier"); if (b) b.onclick = ()=>relier();
    const bd = document.getElementById("aa-bandeau"); if (bd) bd.hidden = !questionOuverte || courant!=="aa-app";
  }
  /* o.retour : où revenir une fois relié (accueil, bateau, pavillons) ; o.attente : l'appli vient de recharger avec le nouveau code */
  function relier(o){
    o = o || {};
    const s = section("aa-classe"); montre("aa-classe");
    const retour = () => o.retour==="pavillons" || o.retour==="bateau" ? ouvreActivite(o.retour) : accueilTel();
    s.innerHTML = `<div class="aa-barre"><button class="aa-retour" id="aa-r">${IC.retour}${o.retour==="pavillons" ? "Pavillons" : o.retour==="bateau" ? "Bateau-école" : "Accueil"}</button></div><div style="padding:0 12px 24px" id="aa-rel"></div>`;
    s.querySelector("#aa-r").onclick = retour;
    EcransAutonome.relier(s.querySelector("#aa-rel"), {retour:o.retour, attente:o.attente, suite:retour,
      suiteTexte:o.retour==="pavillons" ? "Retour aux pavillons" : o.retour==="bateau" ? "Retour au Bateau-école" : "Continuer"});
  }
  async function imprime(b){
    const sm = b && b.querySelector("small"), avant = sm && sm.textContent;
    if (sm) sm.textContent = "Préparation du PDF…";
    try { await Classe.imprimeCartes(); } catch(e){ console.warn(e); alerte("Le PDF n'a pas pu être créé", "Réessaie dans un instant."); }
    if (sm) sm.textContent = avant;
  }
  function alerte(titre, texte){ const d = voile(`<h2>${titre}</h2><p>${texte}</p><div class="aut-boutons" style="grid-template-columns:1fr"><button class="btn prim">OK</button></div>`); d.querySelector("button").onclick = ()=>d.remove(); }

  /* ---------- appel du jour ---------- */
  function appel(){
    const l = Classe.actifs();
    if (!l.length){ classe(); return; }
    const s = section("aa-classe"); montre("aa-classe");
    const dessine = ()=>{ const abs = Classe.absents(), pres = l.length-abs.filter(n=>l.some(e=>e.n===n)).length;
      s.innerHTML = `<div class="aa-barre"><button class="aa-retour" id="aa-r">${IC.retour}Accueil</button><h1>L'appel</h1></div>
        <div class="aa-bloc"><h3>${esc(dateLongue())} <span>${pres} présent${pres>1?"s":""} sur ${l.length}</span></h3>
          <p class="aut-note" style="margin:0">Touche les élèves absents : ils ne comptent pas dans les réponses d'aujourd'hui.</p>
          <div class="aa-appel">${l.map(e=>`<button data-n="${e.n}" aria-pressed="${abs.includes(e.n)}">${esc(e.prenom||("Carte "+e.n))}<small>${abs.includes(e.n)?"absent":"carte "+e.n}</small></button>`).join("")}</div></div>
        <div style="padding:0 12px"><button class="btn prim" style="width:100%;padding:.8em" id="aa-ok">C'est bon</button></div>`;
      s.querySelector("#aa-r").onclick = accueilTel; s.querySelector("#aa-ok").onclick = accueilTel;
      s.querySelector(".aa-appel").onclick = e=>{ const b = e.target.closest("[data-n]"); if (!b) return; Classe.basculeAbsent(+b.dataset.n); dessine(); }; };
    dessine();
  }

  /* ---------- la classe : nom, niveau, élèves et cartes ---------- */
  function editeur(box, o){
    o = o || {};
    const dessine = ()=>{
      const k = Classe.get() || {nom:"", niveau:"", eleves:[]}, l = Classe.actifs();
      box.innerHTML = `${o.sansNom ? "" : `<div class="aa-bloc">
          <label class="aa-champ">Nom de la classe<input id="cl-nom" value="${esc(k.nom)}" placeholder="Par exemple : CM1 de Mme Martin" maxlength="60" autocomplete="off"></label>
          <div class="aa-champ">Niveau<div class="aa-puces" id="cl-niv">${Classe.NIVEAUX.map(x=>`<button type="button" aria-pressed="${k.niveau===x}">${x}</button>`).join("")}</div></div></div>`}
        <div class="aa-bloc"><h3>Élèves <span id="cl-compte">${l.length} sur ${Classe.MAX} cartes</span></h3>
          ${l.length ? "" : `<p class="cl-vide">Écris un prénom ci-dessous, ou colle toute la liste de ta classe.</p>`}
          <ol class="cl-liste">${l.map(e=>`<li data-n="${e.n}"><span data-motif="${e.n}"></span><span class="cl-n num">${e.n}</span>
            <input value="${esc(e.prenom)}" placeholder="Prénom" maxlength="24" aria-label="Prénom de la carte ${e.n}" autocomplete="off" autocorrect="off"><button class="cl-moins" aria-label="Retirer">−</button></li>`).join("")}</ol>
          <form class="cl-ajout" id="cl-ajout"><input id="cl-nouveau" placeholder="Prénom du nouvel élève" maxlength="24" enterkeyhint="done" autocomplete="off" autocorrect="off" ${l.length>=Classe.MAX?"disabled":""}><button class="btn mer" ${l.length>=Classe.MAX?"disabled":""}>Ajouter</button></form>
          <button class="btn" id="cl-coller" type="button">Coller une liste d'élèves</button>
          <p class="aut-note" style="margin:0">Chaque élève garde toujours la même carte : son numéro est imprimé dessus, à côté de son prénom.</p></div>`;
      box.querySelectorAll("[data-motif]").forEach(x=>x.replaceWith(Classe.motif(+x.dataset.motif, 34)));
      const nom = box.querySelector("#cl-nom"); if (nom) nom.oninput = ()=>Classe.modifie(c=>{ c.nom = nom.value.trim(); });
      const niv = box.querySelector("#cl-niv"); if (niv) niv.onclick = e=>{ const b = e.target.closest("button"); if (!b) return; Classe.modifie(c=>{ c.niveau = c.niveau===b.textContent ? "" : b.textContent; }); niv.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b && Classe.get().niveau===b.textContent)); };
      box.querySelector(".cl-liste").oninput = e=>{ const li = e.target.closest("li"); if (!li) return; const n = +li.dataset.n; Classe.modifie(c=>{ c.eleves[n-1].prenom = e.target.value.trim().slice(0,24); }); };
      box.querySelector(".cl-liste").onclick = e=>{ const b = e.target.closest(".cl-moins"); if (!b) return; const li = b.closest("li");
        if (!li.classList.contains("retire")){ li.classList.add("retire"); b.textContent = "Retirer"; setTimeout(()=>{ if (li.isConnected){ li.classList.remove("retire"); b.textContent = "−"; } }, 3500); return; }
        const n = +li.dataset.n; Classe.modifie(c=>{ c.eleves[n-1] = {n, prenom:"", actif:false}; }); dessine(); };
      box.querySelector("#cl-ajout").onsubmit = e=>{ e.preventDefault(); const i = box.querySelector("#cl-nouveau"), p = i.value.trim(); if (!p) return;
        Classe.ajoute([p.slice(0,24)]); dessine(); const j = box.querySelector("#cl-nouveau"); if (j){ j.focus(); } };
      box.querySelector("#cl-coller").onclick = ()=>colle(dessine);
      if (o.surChange) o.surChange();
    };
    dessine();
    return dessine;
  }
  function colle(apres){
    const d = voile(`<h2>Coller une liste</h2><p>Colle les prénoms de ta classe : un par ligne, ou copiés depuis ONDE, ton tableur ou un courriel.</p>
      <textarea id="cl-liste" rows="8" style="font:1rem var(--texte);border-radius:12px;border:2px solid #C9D6DD;padding:.6em;width:100%;box-sizing:border-box" placeholder="Cassy&#10;Noé&#10;Hugo…"></textarea>
      <p class="aut-note" id="cl-apercu" style="margin:0">Les noms de famille en majuscules sont enlevés ; deux prénoms pareils reçoivent l'initiale du nom.</p>
      <div class="aut-boutons"><button class="btn" data-r="non">Annuler</button><button class="btn prim" data-r="oui" disabled>Ajouter</button></div>`);
    const t = d.querySelector("#cl-liste"), ok = d.querySelector('[data-r="oui"]'), ap = d.querySelector("#cl-apercu");
    t.oninput = ()=>{ const l = Classe.lisListe(t.value); ok.disabled = !l.length; ok.textContent = l.length ? `Ajouter ${l.length} élève${l.length>1?"s":""}` : "Ajouter";
      ap.textContent = l.length ? l.slice(0,6).join(", ")+(l.length>6?"…":"") : "Les noms de famille en majuscules sont enlevés ; deux prénoms pareils reçoivent l'initiale du nom."; };
    d.addEventListener("click", e=>{ const b = e.target.closest("[data-r]"); if (!b) return;
      if (b.dataset.r==="oui"){ const r = Classe.ajoute(Classe.lisListe(t.value)); if (r.refus) setTimeout(()=>alerte("Classe complète", `${r.refus} élève${r.refus>1?"s n'ont":" n'a"} pas pu être ajouté${r.refus>1?"s":""} : il y a ${Classe.MAX} cartes au maximum.`), 50); }
      d.remove(); if (apres) apres(); });
    setTimeout(()=>t.focus(), 50);
  }
  function classe(){
    const s = section("aa-classe"); montre("aa-classe");
    s.innerHTML = `<div class="aa-barre"><button class="aa-retour" id="aa-r">${IC.retour}Accueil</button><h1>Ma classe</h1></div><div id="aa-ed"></div>
