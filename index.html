  /* ---------- sauvegardes ---------- */
  function sauvegardes(){
    const s = section("aa-classe"); montre("aa-classe");
    s.innerHTML = `<div class="aa-barre"><button class="aa-retour" id="aa-r">${IC.retour}Accueil</button><h1>Sauvegardes</h1></div>
      <div class="aa-bloc"><h3>Garder une copie</h3><p style="margin:0;line-height:1.45">Un fichier avec ta classe (prénoms, cartes) et ton voyage du Bateau-école. Range-le dans Fichiers, ou envoie-le par mail.</p>
        <button class="btn mer" id="aa-exp">Enregistrer une sauvegarde</button></div>
      <div class="aa-bloc"><h3>Importer</h3><p style="margin:0;line-height:1.45">Une sauvegarde de cette appli, la copie téléchargée depuis l'ancienne version du Bateau-école, ou une liste de prénoms (fichier texte ou tableur).</p>
        <button class="btn" id="aa-imp">Choisir un fichier…</button><div id="aa-msg"></div></div>`;
    s.querySelector("#aa-r").onclick = accueilTel;
    s.querySelector("#aa-exp").onclick = ()=>Classe.exporte().catch(()=>alerte("La sauvegarde n'a pas pu être créée", "Réessaie dans un instant."));
    s.querySelector("#aa-imp").onclick = async ()=>{ const t = await Classe.choisitFichier(); if (t==null) return; await importe(t, s.querySelector("#aa-msg")); };
  }
  async function importe(texte, zone){
    const r = Classe.lit(texte), msg = (t, ko) => { if (zone) zone.innerHTML = `<p class="aa-message ${ko?"ko":""}">${t}</p>`; };
    if (r.type==="inconnu"){ msg("Ce fichier n'est pas une sauvegarde de classe.", true); return false; }
    const k = r.classe, n = k ? k.eleves.filter(e=>e.actif).length : (r.prenoms||[]).length;
    const quoi = r.type==="liste" ? `${n} prénom${n>1?"s":""} à ajouter` : `la classe${k && k.nom ? " « "+esc(k.nom)+" »" : ""} (${n} élève${n>1?"s":""})${r.bateau ? " et son voyage du Bateau-école" : ""}`;
    const ok = await new Promise(res=>{ const d = voile(`<h2>Importer ${r.type==="liste" ? "ces prénoms" : "cette sauvegarde"} ?</h2><p>Le fichier contient ${quoi}.${r.type!=="liste" ? " Elle remplacera la classe actuelle." : ""}</p>
        <div class="aut-boutons"><button class="btn" data-r="non">Annuler</button><button class="btn prim" data-r="oui">Importer</button></div>`);
      d.addEventListener("click", e=>{ const b = e.target.closest("[data-r]"); if (!b) return; d.remove(); res(b.dataset.r==="oui"); }); });
    if (!ok) return false;
    await Classe.importe(r);
    msg(r.bateau ? "C'est fait. Le voyage passera sur l'écran de la classe dès qu'il sera relié." : "C'est fait.");
    return true;
  }

  /* ---------- installation guidée (premier lancement du téléphone) ---------- */
  function bienvenue(etape){
    const s = section("aa-bienvenue"); montre("aa-bienvenue");
    etape = etape || 0;
    const pas = `<div class="aa-pas" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<etape?"fait":i===etape?"ici":""}"></i>`).join("")}</div>`;
    const suite = n => ()=>bienvenue(n), fin = ()=>{ lsSet("bateau-ecole-bienvenue","1"); if (!Classe.existe()) Classe.cree({}); accueilTel(); };
    if (etape===0){
      s.innerHTML = `${pas}<div class="aa-etape"><img class="perro" src="img/perroquet-salut.webp" alt="">
        <h1>Bienvenue à bord !</h1><p>En deux minutes, on prépare ta classe : les prénoms, les cartes-réponses, et l'écran de la classe.</p>
        <div class="aa-actions"><button class="btn prim big" id="aa-go">Commencer</button><button class="btn" id="aa-imp">J'ai déjà une sauvegarde</button></div>
        <div id="aa-msg"></div><p class="aa-pied">Pas de compte à créer. Les prénoms restent sur tes appareils.</p></div>`;
      s.querySelector("#aa-go").onclick = suite(1);
      s.querySelector("#aa-imp").onclick = async ()=>{ const t = await Classe.choisitFichier(); if (t==null) return; if (await importe(t, s.querySelector("#aa-msg"))) setTimeout(()=>bienvenue(3), 900); };
      return;
    }
    if (!Classe.existe()) Classe.cree({});
    if (etape===1){
      s.innerHTML = `${pas}<div class="aa-etape"><h1>Ta classe</h1><p>Comment s'appelle-t-elle, et quel est son niveau ?</p><div id="aa-ed"></div>
        <div class="aa-actions"><button class="btn prim big" id="aa-go">Suivant</button></div></div>`;
      const ed = s.querySelector("#aa-ed"); editeur(ed); ed.querySelectorAll(".aa-bloc")[1].remove(); ed.firstElementChild.style.margin = "0";
      s.querySelector("#aa-go").onclick = suite(2);
      return;
    }
    if (etape===2){
      s.innerHTML = `${pas}<div class="aa-etape"><h1>Tes élèves</h1><p>Écris les prénoms un par un, ou colle la liste de ta classe. Chaque élève reçoit une carte numérotée.</p><div id="aa-ed"></div>
        <div class="aa-actions"><button class="btn prim big" id="aa-go">Suivant</button><button class="aa-lien" id="aa-plus-tard">Plus tard (25 cartes sans prénom)</button></div></div>`;
      const ed = s.querySelector("#aa-ed"); const re = editeur(ed, {sansNom:true, surChange:()=>{ const b = ed.firstElementChild; if (b) b.style.margin = "0"; }}); re();
      s.querySelector("#aa-go").onclick = suite(3);
      s.querySelector("#aa-plus-tard").onclick = ()=>{ if (!Classe.actifs().length) Classe.modifie(c=>{ c.eleves.forEach((e,i)=>{ e.actif = i<25; }); }); bienvenue(3); };
      return;
    }
    if (etape===3){
      const n = Math.max(1, Classe.actifs().length);
      s.innerHTML = `${pas}<div class="aa-etape"><h1>Les cartes-réponses</h1>
        <div class="aa-carte-demo"><span></span><span>A</span><span></span><span style="transform:rotate(90deg)">D</span><span id="aa-motif"></span><span style="transform:rotate(-90deg)">B</span><span></span><span style="transform:rotate(180deg)">C</span><span></span></div>
        <p>Chaque élève a sa carte. Pour répondre, il la lève en mettant en haut la lettre de sa réponse : le téléphone lit toute la classe d'un coup.</p>
        <div class="aa-actions"><button class="btn mer big" id="aa-pdf">Imprimer les ${n>1?n+" ":""}cartes (PDF)</button>
          <p class="aut-note" style="margin:0;text-align:center">Imprime en noir et blanc, à 100 %, sur papier épais (pas de plastification brillante).</p>
          <button class="btn prim big" id="aa-go">Suivant</button></div></div>`;
      s.querySelector("#aa-motif").replaceWith(Classe.motif((Classe.actifs()[0]||{n:1}).n, 120));
      s.querySelector("#aa-pdf").onclick = ()=>Classe.imprimeCartes().catch(()=>alerte("Le PDF n'a pas pu être créé", "Tu pourras le refaire depuis l'accueil."));
      s.querySelector("#aa-go").onclick = suite(4);
      return;
    }
    s.innerHTML = `${pas}<div class="aa-etape"><h1>L'écran de la classe</h1><p>Le jeu s'affiche sur l'ordinateur du TBI, et ce téléphone lit les cartes.</p><div id="aa-rel"></div>
      <div class="aa-actions"><button class="btn prim big" id="aa-go">Terminer</button></div></div>`;
    EcransAutonome.relier(s.querySelector("#aa-rel"), {suite:fin, suiteTexte:"Terminer"});
    s.querySelector("#aa-go").onclick = fin;
  }

  /* ---------- accueil de l'écran de la classe ---------- */
  async function ecran(){
    const s = section("aa-ecran", ""); montre("aa-ecran");
    s.innerHTML = `<img class="soleil" src="img/soleil.webp" alt=""><img class="nuage n1" src="img/nuage1.webp" alt=""><img class="nuage n2" src="img/nuage2.webp" alt=""><img class="nuage n3" src="img/nuage3.webp" alt="">
      <div class="ec-haut"><div class="ec-classe">${esc(nomClasse())}</div><div class="ec-date">${esc(dateLongue())}</div><span class="pastille" id="ec-tel"></span></div>
      <div class="ec-milieu"><h1>Que fait-on aujourd'hui ?</h1><div class="ec-tuiles">
        ${ACTIVITES.map(a=>`<button class="ec-tuile ${a.bientot?"bientot":""}" data-act="${a.id}" ${a.bientot?'aria-disabled="true"':""}><img src="${imgAct(a)}" alt=""><b>${esc(a.nom)}</b><span>${esc(a.texte)}</span><em data-etat="${a.id}"></em><i class="go">${a.bientot?"Bientôt":"Jouer"}</i></button>`).join("")}
      </div></div><div class="mer"></div><div class="mer2"></div>`;
    s.onclick = e=>{ const a = e.target.closest("[data-act]"); if (a) ouvreActivite(a.dataset.act); const p = e.target.closest("#ec-tel"); if (p && !tbiVuTel){ if (!tbiLance){ tbiLance = true; lanceTBI(); ajouteMaisonTBI(); montre("aa-ecran"); } ongletR = "tel"; montre("scr-tbi"); ouvreReglages(); } };
    const p = s.querySelector('[data-etat="pavillons"]'); if (p) p.textContent = "Tables, additions et soustractions";
    const e = s.querySelector('[data-etat="bateau"]'); if (e) e.textContent = await etatBateau();
    dessineTelEcran();
  }
  let tbiVuTel = false, carteQR = null;
  function dessineTelEcran(){
    const p = document.getElementById("ec-tel"); if (!p) return;
    p.textContent = tbiVuTel ? "Téléphone relié" : "Relier le téléphone"; p.style.cursor = tbiVuTel ? "default" : "pointer";
    p.style.background = tbiVuTel ? "#D9F0E1" : "var(--soleil)"; p.style.color = tbiVuTel ? "#1f6b3d" : "var(--nuit)"; p.style.fontWeight = "800";
    const s = document.getElementById("aa-ecran");
    if (!tbiVuTel && !carteQR && s && L.code() && !Autonome.LOCAL){ carteQR = document.createElement("div"); carteQR.className = "aut-accueil";
      carteQR.innerHTML = `<b>Relie ton téléphone</b><div class="lier-qr">${L.qr(null, 240)}</div><p>Dans l'appli du téléphone : « Afficher le jeu sur l'ordinateur », puis « Scanner le QR code ».</p>`;
      s.appendChild(carteQR); }
    if (tbiVuTel && carteQR){ carteQR.remove(); carteQR = null; }
  }

  /* ---------- démarrage ---------- */
  async function demarre(mode){
    roleCourant = mode;
    intro();
    await Classe.init();
    Classe.surChange((k, origine)=>{
      if (estEcran() && Classe.versJeu()){ if (typeof majBarre==="function") majBarre(); }
      if (courant==="aa-app" && origine==="distant") accueilTel();
      if (courant==="aa-ecran") { const c = document.querySelector(".ec-classe"); if (c) c.textContent = nomClasse(); }
    });
    const room = await useCap("room");
    if (window.Pavillons) Pavillons.demarre(mode);
    if (mode==="tbi"){
      window.onEtatRecharge = ()=>{ if (courant==="aa-ecran") ecran(); }; // remplacé par celui du jeu quand il démarre
      brancheDB(); // le voyage s'enregistre (et part en copie vers le téléphone) même avant d'ouvrir le jeu
      if (!Classe.existe()){ const nom = S.eleves.some(e=>e.prenom.trim()); Classe.adopte(Classe.depuisEtat(S, nom ? (S.maj||1) : 0)); }
      else Classe.versJeu();
      if (room){ room.presence({role:"tbi"}).catch(()=>{});
        room.onPeers(ch=>{ tbiVuTel = ch.peers.some(p=>p.presence && p.presence.role==="scanner"); dessineTelEcran(); });
        room.on("cmd", m=>{ const d = m.data||{}; if (d.a!=="activite") return; // le téléphone choisit l'activité, sauf en pleine partie
          const libre = courant==="aa-ecran" || (courant==="pv-ecran" && !Pavillons.occupe()) || (courant==="scr-tbi" && typeof enJeu!=="undefined" && !enJeu);
          if (libre && !(courant==="pv-ecran" && d.id==="pavillons") && !(courant==="scr-tbi" && d.id==="bateau")) ouvreActivite(d.id, true); }); }
      ecran();
    } else {
      if (room){ room.presence({role:"scanner"}).catch(()=>{});
        room.onPeers(ch=>{ tbiVu = ch.peers.some(p=>p.presence && p.presence.role==="tbi"); dessineEcran(); });
        room.on("q", m=>{ const d = m.data||{}; questionOuverte = !!(d.qid && d.open); dessineEcran(); }); }
      if (!Classe.existe() && lsGet("bateau-ecole-bienvenue")!=="1") bienvenue(0);

  const conteneur = () => courant==="aa-ecran" || courant==="pv-ecran" ? document.getElementById(courant) : null;
  return { demarre, ouvreActivite, accueilTel, ecran, classe, editeur, importe, estEcran, montre, bienvenue, conteneur, courant:()=>courant,

/* ---------- version autonome : « Hissez les pavillons » ----------

   (lève sa carte) seulement quand le calcul est juste ; le téléphone, posé face à la classe, filme et compte les cartes levées en direct.
   L'écran de la classe mène la partie et l'annonce (sujet « pv ») ; le téléphone renvoie les cartes vues pendant chaque calcul
   (sujet « pvc ») et sert de télécommande (sujet « cmd », a:"pv"). Les images restent dans le téléphone.
   Chaque carte a son pavillon : celui de sa lettre dans le Code international des signaux (A à Z), puis les flammes 1 à 6. */
const Pavillons = (() => {
  const CLE = "bateau-ecole-pavillons", GRACE = 400;
  const VITESSES = {tranquille:{nom:"Tranquille", calc:9000, revele:3800}, normal:{nom:"Normal", calc:6500, revele:3200}, rapide:{nom:"Rapide", calc:4500, revele:2600}};
  const OPS = {fois:"×", plus:"+", moins:"−"}, NOMS = {fois:"Tables de multiplication", plus:"Additions", moins:"Soustractions"};
  const DEFAUT = {op:"fois", tables:[2,3,4,5], max:20, nb:10, vitesse:"normal"};
  const pl = (n, mot) => n+" "+mot+(n>1 ? "s" : ""), br = n => `${n} bonne${n>1?"s":""} réponse${n>1?"s":""}`;
  let dureesTest = null;

  /* ---------- les pavillons (dessins du Code international des signaux) ---------- */
  const C = {R:"#D7322F", B:"#1F4E9E", Y:"#F7C51E", W:"#FFFFFF", K:"#1B1B1B"};
  const re = (x,y,w,h,c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C[c]}"/>`;
  const po = (pts,c) => `<polygon points="${pts}" fill="${C[c]}"/>`;
  const ro = (x,y,r,c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${C[c]}"/>`;
  const sautoir = c => `<path d="M0 0L60 40M60 0L0 40" stroke="${C[c]}" stroke-width="9"/>`;
  const bandes = (cs, vert) => cs.map((c,i)=>vert ? re(+(i*60/cs.length).toFixed(2),0,+(60/cs.length+.3).toFixed(2),40,c) : re(0,+(i*40/cs.length).toFixed(2),60,+(40/cs.length+.3).toFixed(2),c)).join("");
  const LETTRES = {
    C:bandes(["B","W","R","W","B"]), D:re(0,0,60,40,"Y")+re(0,10,60,20,"B"), E:bandes(["B","R"]), F:re(0,0,60,40,"W")+po("30,4 56,20 30,36 4,20","R"),
    G:bandes(["Y","B","Y","B","Y","B"],1), H:bandes(["W","R"],1), I:re(0,0,60,40,"Y")+ro(30,20,9,"K"), J:bandes(["B","W","B"]), K:bandes(["Y","B"],1),
    L:re(0,0,30,20,"Y")+re(30,0,30,20,"K")+re(0,20,30,20,"K")+re(30,20,30,20,"Y"), M:re(0,0,60,40,"B")+sautoir("W"),
    N:[0,1,2,3].map(i=>[0,1,2,3].map(j=>re(i*15,j*10,15.3,10.3,(i+j)%2 ? "W" : "B")).join("")).join(""),
    O:po("0,0 60,40 0,40","Y")+po("0,0 60,0 60,40","R"), P:re(0,0,60,40,"B")+re(20,13,20,14,"W"), Q:re(0,0,60,40,"Y"),
    R:re(0,0,60,40,"R")+re(26,0,8,40,"Y")+re(0,16,60,8,"Y"), S:re(0,0,60,40,"W")+re(20,13,20,14,"B"), T:bandes(["R","W","B"],1),
    U:re(0,0,30,20,"R")+re(30,0,30,20,"W")+re(0,20,30,20,"W")+re(30,20,30,20,"R"), V:re(0,0,60,40,"W")+sautoir("R"),
    W:re(0,0,60,40,"B")+re(8,6,44,28,"W")+re(17,12,26,16,"R"), X:re(0,0,60,40,"W")+re(26,0,8,40,"B")+re(0,16,60,8,"B"),
    Y:re(0,0,60,40,"Y")+[-40,-20,0,20,40,60].map(x=>`<path d="M${x} 40L${x+40} 0" stroke="${C.R}" stroke-width="7"/>`).join(""),
    Z:po("0,0 60,0 30,20","Y")+po("60,0 60,40 30,20","B")+po("0,40 60,40 30,20","R")+po("0,0 0,40 30,20","K")
  };
  const bf = (x0,x1,c) => po(`${x0},${+(13*x0/60).toFixed(2)} ${x1},${+(13*x1/60).toFixed(2)} ${x1},${+(40-13*x1/60).toFixed(2)} ${x0},${+(40-13*x0/60).toFixed(2)}`, c); // bande d'une flamme
  const FLAMMES = [bf(0,60,"W")+ro(21,20,8,"R"), bf(0,60,"B")+ro(21,20,8,"W"), bf(0,20,"R")+bf(20,40,"W")+bf(40,60,"B"),

  }
  function drapeau(n){

  function image(){

    const fl = pts.map(([t,l])=>{ const [x,y] = q(t), n = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".indexOf(l)+1, [f, c] = corps(n);
      return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang(t).toFixed(1)}) translate(-16 1) scale(.54)">${c}<path d="${f}" fill="none" stroke="#2B1E12" stroke-width="3.4" stroke-linejoin="round"/></g>`; }).join("");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 132"><rect x="14" y="6" width="8" height="122" rx="3" fill="#B07A3E" stroke="#2B1E12" stroke-width="3"/><circle cx="18" cy="7" r="6" fill="#F7C51E" stroke="#2B1E12" stroke-width="3"/>`+

  }

  /* ---------- les calculs ---------- */
  function propre(r){
    r = r && typeof r==="object" ? r : {};
    const o = {op:OPS[r.op] ? r.op : DEFAUT.op,
      tables:(Array.isArray(r.tables) ? r.tables : DEFAUT.tables).map(Number).filter((n,i,l)=>n>=1 && n<=10 && l.indexOf(n)===i).sort((a,b)=>a-b),
      max:[10,20,100].includes(+r.max) ? +r.max : DEFAUT.max, nb:[5,10,15,20].includes(+r.nb) ? +r.nb : DEFAUT.nb, vitesse:VITESSES[r.vitesse] ? r.vitesse : DEFAUT.vitesse};
    if (!o.tables.length) o.tables = DEFAUT.tables.slice();

  }
  const liste = l => l.length<2 ? String(l[0]) : l.slice(0,-1).join(", ")+" et "+l[l.length-1];
  function resume(r){
    r = propre(r);
    const quoi = r.op==="fois" ? (r.tables.length===10 ? "Toutes les tables" : r.tables.length===1 ? "Table de "+r.tables[0] : "Tables de "+liste(r.tables)) : NOMS[r.op]+" jusqu'à "+r.max;
    return `${OPS[r.op]} ${quoi} · ${r.nb} calculs · ${VITESSES[r.vitesse].nom}`;

  const hasard = n => Math.floor(Math.random()*n), pioche = l => l[hasard(l.length)];
  function melange(l){ for (let i=l.length-1;i>0;i--){ const j = hasard(i+1); [l[i], l[j]] = [l[j], l[i]]; } return l; }
  function paire(r){
    if (r.op==="fois"){ const t = pioche(r.tables), k = 1+hasard(10); return Math.random()<.5 ? [t,k] : [k,t]; }

      if (r.max===20){ const a = 1+hasard(19); return [a, 1+hasard(20-a)]; }
      const a = 10+hasard(80); return [a, 1+hasard(99-a)]; }
    const a = r.max===10 ? 1+hasard(10) : r.max===20 ? 5+hasard(16) : 20+hasard(80); return [a, hasard(a+1)];

  function faux(a, b, op, r){

    if (op==="fois"){ c.push(r+a, r-a, r+b, r-b, r+a, r-b, r+2, r-2); if (inv && Math.abs(inv-r)<40) c.push(inv); }

  /* records du palmarès, en phrases (écran de la classe et téléphone) */
  function records(pm, nom){
    const l = [];
    if (pm.eclair) l.push(["eclair", "Pavillon éclair", `${esc(nom(pm.eclair.n))} a hissé son pavillon en ${sec(pm.eclair.t)} sur ${esc(pm.eclair.txt)}`]);

  function palmaresHTML(pm){

  /* ---------- réglages (sur l'écran de la classe comme sur le téléphone) ---------- */
  function reglages(depart, ok){
    let o = propre(depart);
    const d = Accueil.voile(`<h2>Les calculs</h2><div class="pv-regl"></div><div class="aut-boutons"><button class="btn prim" data-r="oui">C'est bon</button><button class="btn" data-r="non">Annuler</button></div>`);

    const rend = () => { z.innerHTML = groupe("op", "Calculs", [["fois","× Tables"],["plus","+ Additions"],["moins","− Soustractions"]], v=>o.op===v)
      + (o.op==="fois" ? groupe("tables", "Quelles tables ?", Array.from({length:10},(_,i)=>[i+1, i+1]), v=>o.tables.includes(+v), "tables")

  /* ================= téléphone : il filme, compte et télécommande ================= */
  let E = null, cam = null, roomT = null, lie = false, cid = null, debut = 0, cumul = new Set(), ouvert = false, envoiT = null, vusVerif = [], reprendre = false, dernier = null;

      tps = new Map(); deja = new Set(); if (dernierVus) dernierVus.forEach((v,n)=>{ if (recu-v.t<900) deja.add(n); }); }

    if (!E || (E.phase!=="calc" && E.phase!=="ferme")) ouvert = false;
    if (cam) cam.question(!!E && ["calc","ferme","verif","compte"].includes(E.phase), false);

    if (telOuvert()){ if (!avant || !E || avant.phase!==E.phase || avant.cid!==E.cid || avant.pause!==E.pause || JSON.stringify(avant.r)!==JSON.stringify(E.r) || E.phase==="verif") dessineJeu(); dessineLien(); majBadge(); }

  function vue(vus, t){

      if (l.join()!==vusVerif.join()){ vusVerif = l; emetT("pvc", {cid:"verif", n:l}); if (telOuvert()){ dessineJeu(); majBadge(); } } return; }
    if (!ouvert) return;
    let neuf = false; vus.forEach((v,n)=>{ if (v.k>=2 && v.t>=debut && !cumul.has(n)){ cumul.add(n); neuf = true; if (!deja.has(n)) tps.set(n, Date.now()-recu); } });

  }

  /* le compteur posé sur l'image : cartes vues pendant l'essai, pavillons hissés pendant un calcul */
  const DRAPEAU_IC = '<svg viewBox="0 0 20 20" width=".75em" height=".75em" aria-hidden="true"><path d="M4 2v16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M5 3h11l-3 4 3 4H5z" fill="currentColor"/></svg>';

    if (E.phase==="calc" || E.phase==="ferme"){ const n = [...cumul].filter(x=>pres.includes(x)).length; cam.badge(`${DRAPEAU_IC} ${n}<small>hissé${n>1?"s":""}</small>`, "mer"); return; }

  async function garde(d){
    if (dernier && dernier.id===d.id) return;

  function tel(){
    const s = Accueil.section("pv-tel"); Accueil.montre("pv-tel");

  return tx<0?"B":"D";

    if (Autonome.LOCAL) mode = "tbi";
    else if (!mode){ const d = Autonome.modeParDefaut(); if (d){ mode = d; lsSet("bateau-ecole-mode", d); } } }
  const lance = m => window.Accueil ? (EcransAutonome.tbi && m==="tbi" && EcransAutonome.tbi(), Accueil.demarre(m)) : (m==="tbi" ? lanceTBI() : lanceTel());
  $("#go-tbi").onclick=()=>{ lsSet("bateau-ecole-mode","tbi"); lance("tbi"); };
  $("#go-tel").onclick=()=>{ lsSet("bateau-ecole-mode","tel"); lance("tel"); };
  if (mode==="tbi"||mode==="tel") lance(mode); else $("#scr-choix").hidden=false;
  if (window.speechSynthesis) speechSynthesis.getVoices();
})();

</script>
