<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2740">
<meta name="format-detection" content="telephone=no">
<title>Le Bateau-école</title>
<style>
:root{
  --nuit:#0B2740; --mer:#1D5C7A; --lagon:#3FA7B5; --ecume:#E6F3F2; --sable:#F3D9A4;
  --corail:#E85D3F; --soleil:#FFC94A; --algue:#2F7A57; --papier:#FFFCF4; --encre:#13263A; --gris:#5B7285;
  --ok:#2F9E5B; --ko:#C8433A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --texte:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
#app{height:100%}
body{margin:0;background:var(--nuit);color:var(--encre);font-family:var(--texte);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--soleil);outline-offset:2px}
.btn{font-weight:800;font-size:1.05rem;padding:.6em 1.15em;border-radius:16px;background:#FFFCF4;color:var(--nuit);border:3px solid #E3CFA2;box-shadow:0 5px 0 #CDB482;line-height:1.1;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #CDB482}
.btn.prim{background:#F26B4A;border-color:#D9502F;color:#fff;box-shadow:0 5px 0 #A93A20;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.prim:active{box-shadow:0 1px 0 #A93A20}
.btn.jaune{background:#FFCB3D;border-color:#E9AE1C;color:#4A3200;box-shadow:0 5px 0 #B98813}
.btn.jaune:active{box-shadow:0 1px 0 #B98813}
.btn.mer{background:#2B8CB5;border-color:#1D6F93;color:#fff;box-shadow:0 5px 0 #15526E}
.btn.mer:active{box-shadow:0 1px 0 #15526E}
.btn.petit{font-size:.95rem;padding:.45em .9em;background:rgba(255,252,244,.92)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.22);box-shadow:none}
.btn.big{font-size:clamp(1.25rem,2.1vw,1.7rem);padding:.5em 1.35em;border-radius:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- choix du mode ---------- */
#scr-choix{min-height:100%;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;background:#6CC3F2 url(img/ciel.webp) center/cover;color:var(--nuit)}
#scr-choix .box{max-width:720px;text-align:center;display:grid;gap:18px}
#scr-choix h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,4.2rem);margin:0;line-height:1;text-wrap:balance;color:#fff;text-shadow:0 3px 0 #1D6F93,0 6px 14px rgba(11,39,64,.35)}
#scr-choix .perro{height:clamp(130px,26vh,240px);margin:0 auto -10px}
#scr-choix p{margin:0;color:#0B2740;font-size:1.15rem;line-height:1.45;font-weight:700}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:8px}
.choix button{padding:22px 18px;border-radius:24px;text-align:left;display:grid;gap:6px;background:var(--papier);color:var(--nuit);border:4px solid #EBD9AE;box-shadow:0 6px 0 rgba(11,39,64,.2)}
.choix button b{font-size:1.5rem}
.choix button span{font-family:var(--texte);font-size:.98rem;color:var(--gris);line-height:1.35}

/* ---------- écran TBI ---------- */
#scr-tbi{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--nuit)}
.bar{display:flex;align-items:center;gap:10px 12px;padding:8px 16px;background:var(--nuit);color:#fff;flex-wrap:nowrap}
.bar .nom{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--soleil);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw;flex:none}
.bar .route{flex:1;min-width:0;display:grid;gap:4px}
.bar .route .lbl{font-size:.9rem;color:#cfe3ea;display:flex;justify-content:space-between;gap:10px;min-width:0}
.bar .route .lbl > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .route .lbl > span:last-child{flex:none}
.bar .route .lbl b{color:#fff}
.jauge{height:12px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lagon),var(--soleil));border-radius:8px;transition:width 1.2s ease}
.pastille{font-size:.85rem;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#cfe3ea;white-space:nowrap}
.pastille.on{background:rgba(47,158,91,.25);color:#b9f0cf}
.bar .outils{display:flex;gap:6px;flex:none}
.bar .outils .btn{padding:.45em .8em;font-size:.95rem}
.bar .pastille{flex:none}
#stage{position:relative;flex:1;min-height:0}
#sea{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:16px;box-sizing:border-box;pointer-events:none;overflow:auto}
.layer > *{pointer-events:auto}
.home-cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.home-titre{font-family:var(--display);color:#fff;text-align:center;background:rgba(11,39,64,.78);border-radius:22px;padding:14px 28px 16px;max-width:900px}
.home-titre .k{font-size:clamp(1rem,1.6vw,1.3rem);color:var(--sable);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.home-titre .t{font-size:clamp(2rem,4.2vw,3.6rem);font-weight:800;line-height:1.05;text-wrap:balance}
.home-titre .s{font-family:var(--texte);font-size:clamp(1rem,1.5vw,1.25rem);color:#e8f4f6;margin-top:6px}

.carte{background:var(--papier);border-radius:28px;border:4px solid #EBD9AE;box-shadow:0 7px 0 rgba(11,39,64,.22),0 18px 34px rgba(4,20,35,.28);padding:22px 26px;width:min(1100px,100%);box-sizing:border-box}
.avec-perro{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;align-items:center}
.perro{display:block;height:auto}
.perro.coin{height:clamp(110px,20vh,190px);width:auto;max-width:28vw;object-fit:contain}
.accueil{position:relative;display:flex;justify-content:center;width:min(680px,100%,70vh)}
.accueil .perro{position:absolute;right:calc(100% - 10px);bottom:-6px;height:clamp(110px,26vh,230px);width:auto;filter:drop-shadow(0 6px 8px rgba(4,20,35,.25))}
@media (max-width:1000px){.accueil .perro{display:none}}
.pancarte{flex:1;width:100%;aspect-ratio:1400/773;background:url(img/pancarte.webp) center/100% 100% no-repeat;container-type:inline-size;box-sizing:border-box;padding:16% 11% 6%;display:flex;flex-direction:column;justify-content:center;text-align:center;filter:drop-shadow(0 8px 10px rgba(4,20,35,.25))}
.pancarte .k{font-family:var(--display);font-weight:800;font-size:3.6cqw;color:#9A5B1E;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.pancarte .t{font-family:var(--display);font-weight:800;font-size:9.6cqw;color:#5B3212;line-height:1.05;text-wrap:balance}
.pancarte .s{font-family:var(--texte);font-weight:700;font-size:4.1cqw;color:#6B4524;line-height:1.3;margin-top:1cqw}
.postale-carte{background:linear-gradient(rgba(255,249,234,.9),rgba(255,249,234,.9)) content-box,#F7E9C8 url(img/parchemin.webp) center/cover border-box;border-color:#D8B878;padding:clamp(18px,3.2vw,38px)}
.timbre-cadre{position:relative;height:min(40vh,360px);aspect-ratio:520/691;flex:none;filter:drop-shadow(0 6px 8px rgba(60,40,10,.3));transform:rotate(-2deg)}
.timbre-cadre .photo{position:absolute;left:14.5%;top:10.5%;width:71%;height:79%;object-fit:cover}
.timbre-cadre .cadre{position:absolute;inset:0;width:100%;height:100%}
.timbre-cadre .tampon{position:absolute;left:-14%;bottom:-9%;width:52%;opacity:.9;transform:rotate(-16deg);animation:tampon .45s .9s both cubic-bezier(.3,1.6,.5,1)}
@keyframes tampon{from{transform:scale(2.4) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(-16deg);opacity:.9}}
.truc{display:flex;gap:14px;align-items:center;margin-top:14px;padding:10px 16px;border-radius:18px;background:#FFF4CF;border:3px solid #F2D27A;font-size:clamp(1.05rem,1.8vw,1.45rem);line-height:1.35;animation:apparait .4s ease both}
.truc img{height:clamp(56px,9vh,86px);width:auto;flex:none}
.truc b{display:block;font-family:var(--display);color:#9A5B1E;font-size:.8em;text-transform:uppercase;letter-spacing:.05em}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grade-pill{background:rgba(255,252,244,.92);border:3px solid #EBD9AE;border-radius:999px;padding:6px 16px;font-family:var(--display);font-size:1.05rem;color:var(--nuit)}
.etoiles{color:#F2A900;letter-spacing:2px}.etoiles .vides{color:rgba(11,39,64,.18)}
.rappel{display:flex;align-items:center;gap:14px;max-width:760px;padding:10px 14px}
.rappel img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.rappel div{flex:1;display:grid;gap:2px}.rappel b{font-family:var(--display);font-size:1.15rem}.rappel span{color:var(--gris)}
.passeport{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:min(100%,118vh);margin:0 auto}
.case{position:relative;aspect-ratio:4/3;border:3px dashed rgba(160,110,50,.55);border-radius:14px;background:rgba(255,252,244,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden}
.case .n{position:absolute;top:4px;left:8px;font-family:var(--display);font-weight:800;color:#A0521D;font-size:.9rem}
.case .v{font-family:var(--display);font-weight:800;font-size:clamp(.7rem,1.2vw,1rem);color:#4A2C10;line-height:1.1;position:relative;z-index:1}
.case .d{font-size:.72rem;color:#6B4524;position:relative;z-index:1}
.case .tp{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain;opacity:.6}
.case.atteint{border-style:solid}
.case.a-tamponner{border:4px solid var(--corail);background:#FFF1E6;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
.case.vient .tp{animation:tampon .45s both cubic-bezier(.3,1.6,.5,1)}
@keyframes pulse{50%{transform:scale(1.06)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.vignette{margin:0;background:#FFFCF4;border-radius:16px;border:3px solid #EBD9AE;overflow:hidden;display:flex;flex-direction:column}
.vignette img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.vignette.ok{cursor:pointer}
.vignette .mystere{aspect-ratio:1/1;display:grid;place-items:center;font-family:var(--display);font-size:3rem;color:rgba(11,39,64,.25);background:repeating-linear-gradient(45deg,#EFE3C6,#EFE3C6 10px,#E8D9B4 10px,#E8D9B4 20px)}
.vignette figcaption{padding:6px 8px;display:grid;line-height:1.2}
.vignette figcaption b{font-family:var(--display);font-size:.95rem}.vignette figcaption span{font-size:.8rem;color:var(--gris)}
.vignette.grande{max-width:340px;margin:10px auto}
.consigne{margin:12px 0 0;padding-left:1.3em;font-size:clamp(1.05rem,1.8vw,1.4rem);line-height:1.4;color:#3B2A18}
.mots{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:clamp(.95rem,1.5vw,1.2rem)}
.mots b{font-family:var(--display);color:#A0521D}
.mots span{background:rgba(255,252,244,.9);border:2px solid #E3CFA2;border-radius:999px;padding:3px 12px}
.coup-de-pouce{margin-top:12px;padding:10px 14px;border-radius:14px;background:rgba(255,252,244,.92);font-size:clamp(1.05rem,1.8vw,1.35rem);line-height:1.5}
@media (max-width:760px){.passeport{grid-template-columns:repeat(4,1fr)}}
.carte-monde{background:linear-gradient(rgba(255,249,234,.9),rgba(255,249,234,.9)) content-box,#F7E9C8 url(img/parchemin.webp) center/cover border-box;border-color:#D8B878;padding:clamp(18px,3.2vw,38px)}
.carte-monde h2{margin-right:110px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1rem;padding:3px 12px;border-radius:999px;color:#fff}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q-num{font-family:var(--display);font-weight:700;color:var(--gris);font-size:1.1rem}
.q-txt{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.1vw,2.8rem);line-height:1.15;margin:10px 0 16px;white-space:pre-line;text-wrap:balance;color:var(--encre)}
.choixq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:20px;background:#E3F4F6;border:3px solid #C9E6EC;font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:700;position:relative;overflow:hidden;min-height:64px}
.opt .l{flex:none;width:2.3em;height:2.3em;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.opt .tx{position:relative;z-index:1;font-family:var(--texte)}
.opt .bar-r{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(29,92,122,.14);transition:width .9s ease}
.opt .cpt{margin-left:auto;position:relative;z-index:1;font-family:var(--display);font-size:.9em;color:var(--gris)}
.opt.bon{background:#DDF3E5;outline:4px solid var(--ok)}
.opt.faux{opacity:.55}
.L0,.L1,.L2,.L3{background:center/contain no-repeat;color:#0B2740!important;text-shadow:0 0 4px #fff,0 0 2px #fff}
.L0{background-image:url(img/bouee1.webp)}.L1{background-image:url(img/bouee2.webp)}.L2{background-image:url(img/bouee3.webp)}.L3{background-image:url(img/bouee4.webp)}
.q-pied{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.q-pied .espace{flex:1}
.lus{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--gris)}
.lus b{font-family:var(--display);font-size:1.6rem;color:var(--encre);white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.dots span{width:24px;height:24px;border-radius:7px;background:#D8E4EA;color:#6c8394;font-size:.72rem;display:grid;place-items:center;font-weight:700}
.dots span.v{background:var(--lagon);color:#fff}
.manuel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.manuel .lab{font-weight:700;color:var(--gris)}
.gain{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--mer)}
.msg-big{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,3rem);text-align:center;line-height:1.1;text-wrap:balance;color:var(--encre);margin:.2em 0}
.sous{text-align:center;color:var(--gris);font-size:1.15rem;line-height:1.45;margin:0 auto;max-width:60ch}
.centre{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.orage-jauge{width:min(700px,90%);margin:6px auto 0}
.orage-jauge .jauge{height:18px;background:rgba(0,0,0,.12)}
.orage-jauge .jauge i{background:linear-gradient(90deg,#6A5ACD,#2C2A4A)}

/* carte postale */
.postale{display:grid;grid-template-columns:auto 1fr;gap:26px 34px;align-items:center}
.postale .timbre{aspect-ratio:3/4;height:min(36vh,320px);max-width:100%;box-sizing:border-box;border-radius:10px;background:var(--sable);display:grid;place-items:center;font-size:clamp(3.5rem,min(9vw,14vh),8rem);border:6px dashed #fff;outline:2px solid var(--sable);position:relative}
.postale .timbre small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--display);font-size:1rem;color:var(--nuit)}
.postale h2{font-family:var(--display);font-size:clamp(1.8rem,3.4vw,3rem);margin:0;line-height:1.05;color:#4A2C10}
.postale h2 small{display:block;font-size:.5em;color:var(--corail);text-transform:uppercase;letter-spacing:.06em}
.postale dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0 0;font-size:clamp(1.05rem,1.7vw,1.4rem);line-height:1.35}
.postale dt{font-family:var(--display);font-weight:800;color:#A0521D}
.postale dd{color:#3B2A18}
.postale dd{margin:0}

/* mini-jeux */
#mini{position:absolute;inset:0;touch-action:none;display:block;width:100%;height:100%}
.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(11,39,64,.8);color:#fff;border-radius:14px;padding:8px 18px;font-family:var(--display);font-size:1.4rem;font-weight:700;pointer-events:none;white-space:nowrap}

/* panneaux (carte, journal, réglages) */
.panneau{position:absolute;inset:0;background:rgba(6,24,40,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto;z-index:5}
.panneau .carte{position:relative}
.fermer{position:absolute;top:12px;right:12px}
.panneau h2{font-family:var(--display);margin:0 0 10px;font-size:1.8rem;color:var(--nuit)}
.panneau h3{font-family:var(--display);margin:18px 0 8px;font-size:1.3rem;color:var(--mer)}
.monde{width:100%;height:auto;display:block;border-radius:14px;background:rgba(90,170,200,.3);border:3px solid rgba(160,110,50,.35)}
.monde .terre{fill:#E6C27E;stroke:#A87838;stroke-width:.3}
.monde .route{fill:none;stroke:var(--mer);stroke-width:.5;stroke-dasharray:1.2 1}
.monde .faite{fill:none;stroke:var(--corail);stroke-width:.8}
.monde .esc{fill:#fff;stroke:var(--mer);stroke-width:.4;cursor:pointer}
.monde .esc.ok{fill:var(--corail);stroke:#fff}
.monde text{font-family:var(--texte);font-size:2.6px;fill:var(--nuit);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:.6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 14px;border-radius:12px;background:var(--ecume);color:var(--nuit);font-weight:700;font-size:1rem}
.tabs button.act{background:var(--mer);color:#fff}
.grille-el{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.grille-el label{display:flex;align-items:center;gap:8px;background:var(--ecume);border-radius:12px;padding:6px 10px}
.grille-el .n{font-family:var(--display);font-weight:800;width:2ch;text-align:right;color:var(--mer)}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid #C9DAE2;background:#fff;color:var(--encre);min-width:0}
.grille-el input[type=text]{flex:1;width:100%}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.notion{border:2px solid #DCE7EC;border-radius:14px;padding:8px 12px;margin:8px 0}
.notion summary{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;font-weight:700}
.notion summary .espace{flex:1}
.qliste{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.qliste li{display:flex;gap:10px;align-items:flex-start;background:var(--ecume);border-radius:10px;padding:8px 10px}
.qliste li .q{flex:1;white-space:pre-line}
.qliste li .rep{color:var(--ok);font-weight:700}
.qliste button{background:none;color:var(--ko);font-weight:700;padding:2px 6px}
.qliste button.ed{color:var(--mer)}
.form-q{display:grid;gap:8px;background:#F4F8FA;border-radius:12px;padding:12px;margin-top:8px}
.form-q .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.form-q .opts label{display:flex;gap:6px;align-items:center}
.form-q .opts input[type=text]{flex:1}
.tbl-wrap{overflow-x:auto}
table.bilan{border-collapse:collapse;font-size:.95rem}
table.bilan th,table.bilan td{border:1px solid #DCE7EC;padding:5px 8px;text-align:center}
table.bilan th{background:var(--ecume);font-family:var(--display)}
table.bilan td.nm{text-align:left;font-weight:700;white-space:nowrap}
.p0{background:#F6D5D1}.p1{background:#FBE9C6}.p2{background:#D9F0E1}
.journal{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.journal li{background:var(--ecume);border-radius:12px;padding:10px 14px;line-height:1.4}
.journal li small{display:block;color:var(--gris)}
.j-jour{margin:16px 0 8px;font-family:var(--display);color:var(--mer);font-size:1.1rem;text-transform:capitalize}
.j-tete{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.j-tete b{flex:1;min-width:12ch}.j-m{color:var(--ok);font-weight:800}
.j-res{color:var(--gris);margin-top:4px}.j-det{margin:6px 0 0;padding-left:1.2em;list-style:disc}.j-det li{background:none;padding:0;border-radius:0}
.j-mot{margin:6px 0 0;font-style:italic;color:#3B2A18}
.postale-carte>:not(.fermer),.carte-monde>:not(.fermer){margin-left:clamp(10px,1.8vw,22px);margin-right:clamp(10px,1.8vw,22px)}
.postale-carte>:first-child:not(.fermer),.carte-monde>:first-child:not(.fermer){margin-top:clamp(8px,1.4vw,16px)}
.postale-carte>:last-child:not(.fermer),.carte-monde>:last-child:not(.fermer),.carte-monde>:nth-last-child(2){margin-bottom:clamp(8px,1.4vw,16px)}
.carte-monde>h2:not(.fermer){margin-right:120px}
@media (max-width:640px){.carte-monde>h2:not(.fermer){margin-right:100px}}
.son-liste{display:grid;gap:6px;margin-top:10px}
.son-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ecume);border-radius:12px;padding:8px 12px}
.son-l.ouvert{border-radius:12px 12px 0 0;background:#DCEFF4}
.son-nom{flex:1;min-width:16ch;display:flex;flex-direction:column}.son-nom span{color:var(--gris);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48ch}
.son-etat{font-size:.78rem}
.son-l .btn{padding:6px 14px;font-size:.95rem}
.son-ed{background:#DCEFF4;border-radius:0 0 12px 12px;padding:12px 14px;margin-top:-6px;display:grid;gap:10px}
.son-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.son-meta label,.son-coupe label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.son-coupe .ligne label:has(input[type=checkbox]){flex-direction:row;align-items:center;font-weight:600}
.son-src .note,.son-act .note{margin:0}
.credit-mus{text-align:center;margin-top:8px;font-size:.85rem;color:#6B4524}
.note{color:var(--gris);font-size:.95rem;line-height:1.45;max-width:75ch}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--nuit);color:#fff;padding:10px 18px;border-radius:12px;z-index:20;font-weight:700;max-width:90%}

/* ---------- téléphone ---------- */
#scr-tel{min-height:100%;background:var(--ecume);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
#scr-tel header{display:flex;justify-content:space-between;align-items:center;gap:8px}
#scr-tel h1{font-family:var(--display);font-size:1.5rem;margin:0;color:var(--nuit)}
.tel-q{background:#fff;border-radius:16px;padding:12px 14px;display:grid;gap:4px}
.tel-q .k{font-size:.85rem;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.tel-q .t{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.2;white-space:pre-line}
.photo-btn{display:grid;place-items:center;gap:4px;background:var(--corail);color:#fff;border-radius:18px;padding:22px 12px;font-family:var(--display);font-weight:800;font-size:1.5rem;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.photo-btn small{font-family:var(--texte);font-weight:400;font-size:.95rem;opacity:.95}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0}
.tel-res{background:#fff;border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.tel-res .gros{font-family:var(--display);font-size:2.2rem;font-weight:800;color:var(--nuit);line-height:1}
.tel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.tel-grid span{border-radius:9px;background:#E3EBEF;color:#7a8f9e;text-align:center;padding:5px 2px;font-size:.78rem;line-height:1.15}
.tel-grid span b{display:block;font-size:1rem;color:inherit}
.tel-grid span.v{background:var(--lagon);color:#fff}
.tel-grid span.ok{background:var(--ok);color:#fff}
.tel-grid span.ko{background:var(--ko);color:#fff}
#apercu{width:100%;border-radius:12px;display:block}
.tel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:reduce){.jauge i,.opt .bar-r{transition:none}}
 @media (max-width:980px){.bar{flex-wrap:wrap}.bar .route{order:9;flex-basis:100%}.bar .nom{max-width:none;flex:1}}
@media (max-width:560px){.bar .nom{flex-basis:100%}.dots{display:none}.bar .outils .btn{font-size:.82rem;padding:.4em .55em}.bar .pastille{font-size:.75rem;padding:4px 8px}.bar .nom{font-size:1.15rem}}
 @media (max-width:640px){.avec-perro{grid-template-columns:1fr}.avec-perro .perro.coin{display:none}.accueil .perro{display:none}.pancarte{max-width:none}.carte-monde h2{margin-right:90px}}
@media (max-width:700px){.choixq{grid-template-columns:1fr}.postale{grid-template-columns:1fr}.timbre-cadre{height:min(30vh,240px);justify-self:center}.postale-carte .tampon{left:-8%}}
</style>

    <p>Le rituel du matin de la classe : on révise, le bateau avance, et on fait le tour du monde.</p>
    <div class="choix">

  </div>
</section>

<script>
/* ---------- version autonome : ce que fournissait claude.ai ----------
   Sauvegarde (db), liaison TBI ↔ téléphone (room), fichiers (assets) et téléchargements (downloads),
   avec la même interface que window.claude.use() : le reste du jeu ne voit pas la différence.
   Tourne dans un navigateur (TBI) et dans l'appli iOS / Android (Capacitor).
   Deux chemins pour la liaison, pris ensemble quand ils existent :
   - par internet : des relais publics gratuits (Nostr sur le port 443, MQTT en secours) ;
   - sans internet : l'appli sert le jeu à l'ordinateur par le Wi-Fi (plugin ServeurClasse) et les messages passent en direct.
   Tout est chiffré de bout en bout avec une clé tirée du code de la classe : les relais ne voient que des messages illisibles. */
"use strict";
window.BATEAU_AUTONOME = true;
const Autonome = (() => {
  const CAP = window.Capacitor;
  const NATIF = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
  const LOCAL = window.BATEAU_LOCAL || null; // page servie par l'appli d'un téléphone, sur le Wi-Fi de la classe
  const WEB = "https://pookee.github.io/bateau-ecole/"; // adresse du jeu pour l'ordinateur, avec internet
  const plug = n => { if (!NATIF) return null; try { return (CAP.Plugins && CAP.Plugins[n]) || (CAP.registerPlugin && CAP.registerPlugin(n)) || null; } catch(e){ return null; } };
  const Prefs = plug("Preferences");
  const lsG = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const lsS = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
  const lsD = k => { try { localStorage.removeItem(k); } catch(e){} };
  /* stockage durable : Preferences dans l'appli (iOS peut vider le localStorage d'une vue web), localStorage sinon */
  const Stock = {
    async get(k){ if (Prefs){ try { const r = await Prefs.get({key:k}); if (r && r.value!=null) return r.value; } catch(e){} } return lsG(k); },
    async set(k,v){ lsS(k,v); if (Prefs){ try { await Prefs.set({key:k, value:v}); } catch(e){} } },
    async del(k){ lsD(k); if (Prefs){ try { await Prefs.remove({key:k}); } catch(e){} } }
  };
  const te = new TextEncoder(), td = new TextDecoder();
  const hex = u => Array.from(u, b=>b.toString(16).padStart(2,"0")).join("");
  const rid = n => hex(crypto.getRandomValues(new Uint8Array(n||8)));
  const cat = (...a) => { let n=0; a.forEach(x=>n+=x.length); const o=new Uint8Array(n); let p=0; a.forEach(x=>{ o.set(x,p); p+=x.length; }); return o; };
  const b64 = u => { let s=""; for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
  const deb64 = s => { const b=atob(s); const u=new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  let role = null; // fixé à l'ouverture de la liaison : deux onglets du même navigateur peuvent avoir deux rôles
  const mode = () => role || lsG("bateau-ecole-mode") || "";

  /* ---------- code de liaison : 10 caractères (base 32 de Crockford), affiché XXXXX-XXXXX ---------- */
  const ALPHA = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function nouveauCode(){ const b = crypto.getRandomValues(new Uint8Array(10)); let s=""; for (const x of b) s += ALPHA[x & 31]; return s.slice(0,5)+"-"+s.slice(5); }
  function normalise(c){
    c = String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/[IL]/g,"1").replace(/O/g,"0").replace(/U/g,"V");
    if (c.length!==10 || [...c].some(x=>ALPHA.indexOf(x)<0)) return null;
    return c.slice(0,5)+"-"+c.slice(5);
  }

  /* ---------- chiffrement : clé AES-GCM et étiquette de salon tirées du code (PBKDF2) ---------- */
  const SUBTLE = !!(window.crypto && crypto.subtle); // absent si la page vient du téléphone en http : on chiffre alors en JavaScript
  async function cles(code){
    const mot = te.encode(code.replace("-","")), sel = te.encode("bateau-ecole/liaison/v1");
    let bits;
    if (SUBTLE){ const base = await crypto.subtle.importKey("raw", mot, "PBKDF2", false, ["deriveBits"]);
      bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:sel, iterations:120000, hash:"SHA-256"}, base, 384)); }
    else bits = await NostrLite.derive(mot, sel, 120000, 48);
    const tag = hex(bits.slice(32,48)), brute = bits.slice(0,32);
    return {tag, aad:te.encode("bateau-ecole:"+tag), cle: SUBTLE ? await crypto.subtle.importKey("raw", brute, "AES-GCM", false, ["encrypt","decrypt"]) : brute};
  }
  async function chiffre(k, u){ const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = SUBTLE ? new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv, additionalData:k.aad}, k.cle, u)) : NostrLite.aesGcm(k.cle, iv, k.aad).encrypt(u);
    return b64(cat(iv, c)); }
  async function dechiffre(k, s){ const u = deb64(s), iv = u.slice(0,12), c = u.slice(12);
    return SUBTLE ? new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv, additionalData:k.aad}, k.cle, c)) : NostrLite.aesGcm(k.cle, iv, k.aad).decrypt(c); }
  async function gzip(u, compresse){
    const flux = new Blob([u]).stream().pipeThrough(compresse ? new CompressionStream("gzip") : new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(flux).arrayBuffer());
  }

  /* ---------- relais ---------- */
  const KIND = 25555; // événements Nostr éphémères : relayés en direct, jamais stockés
  // relais testés le 27/09/2026 à un message par seconde sans refus (damus bannit à ce rythme, nos.lol était en panne)
  const RELAIS_DEFAUT = ["nostr:wss://relay.primal.net","nostr:wss://nostr.mom","nostr:wss://relay.snort.social","nostr:wss://relay.nostr.net",
    "mqtt:wss://test.mosquitto.org:8081/mqtt","mqtt:wss://broker.hivemq.com:8884/mqtt"];
  function listeRelais(){
    const q = /[?&#]relais=([^&#]+)/.exec(location.href);
    if (q) return decodeURIComponent(q[1]).split(",").map(s=>s==="local"?"local:":s);
    try { const l = JSON.parse(lsG("bateau-ecole-relais")||"null"); if (Array.isArray(l) && l.length) return l; } catch(e){}
    return RELAIS_DEFAUT;
  }
  function transportNostr(url, k, recoit, change){
    let ws=null, pret=false, fini=false, attente=1500, minuteur=null, jetons=5, remplie=Date.now(), pompe=null, direct=false, tDirect=null;
    const sub = "be"+rid(6), sk = NostrLite.cleSecrete(), pk = NostrLite.clePublique(sk), file = [];
    /* les relais Nostr limitent le débit : au plus ~1 message/s en continu (5 d'un coup), et un message d'état
       (présence, question, cartes lues) remplace le précédent du même genre encore en attente */
    function envoieBrut(txt){ try { ws.send(JSON.stringify(["EVENT", NostrLite.signe({pubkey:pk, created_at:Math.floor(Date.now()/1000), kind:KIND, tags:[["t",k.tag]], content:txt}, sk)])); } catch(e){} }
    function pompeFile(){
      if (pompe) return;
      pompe = setTimeout(()=>{ pompe = null; if (!pret) return;
        const t = Date.now(); jetons = Math.min(5, jetons+(t-remplie)/1100); remplie = t;
        while (file.length && file[0].t < t-20000) file.shift(); // trop vieux : les autres relais l'ont porté
        while (file.length && jetons>=1){ const it = file[0]; envoieBrut(it.txts.shift()); jetons--; it.cle = null; if (!it.txts.length) file.shift(); }
        if (file.length) pompeFile(); }, file.length && jetons<1 ? 400 : 0);
    }
    function ouvre(){
      clearTimeout(minuteur); minuteur=null;
      try { ws = new WebSocket(url); } catch(e){ return plusTard(); }
      const moi = ws;
      /* certains relais gardent les événements « éphémères » et les renvoient à l'abonnement (constaté le 27/09/2026) :
         tout ce qui arrive avant la fin des événements stockés (EOSE) est ignoré, sinon un vieux voyage ou une vieille commande reviendrait */
      ws.onopen = ()=>{ if (moi!==ws) return; pret=true; attente=1500; direct=false; clearTimeout(tDirect); tDirect = setTimeout(()=>{ direct=true; }, 3000);
        ws.send(JSON.stringify(["REQ", sub, {kinds:[KIND], "#t":[k.tag]}])); change(); pompeFile(); };
      ws.onmessage = e=>{ let m; try { m = JSON.parse(e.data); } catch(x){ return; }
        if (m[0]==="EOSE" && m[1]===sub){ direct = true; clearTimeout(tDirect); return; }
        if (m[0]==="EVENT" && m[1]===sub && m[2] && typeof m[2].content==="string"){
          if (!direct || (m[2].created_at||0) < Date.now()/1000-900) return; // stocké, ou vieux de plus d'un quart d'heure
          recoit(m[2].content); }
        else if (m[0]==="OK" && m[2]===false) console.warn("relais", url, m[3]); };
      ws.onclose = ()=>{ if (moi!==ws) return; pret=false; change(); if (!fini) plusTard(); };
      ws.onerror = ()=>{ try { moi.close(); } catch(e){} };
    }
    function plusTard(){ if (minuteur||fini) return; minuteur = setTimeout(()=>{ minuteur=null; if (!fini) ouvre(); }, attente); attente = Math.min(30000, attente*2); }
    ouvre();
    return { nom:url.replace(/^wss:\/\//,""), pret:()=>pret,
      envoie(txts, cle){ if (cle){ const i = file.findIndex(x=>x.cle===cle); if (i>=0) file.splice(i,1); } file.push({cle, txts:txts.slice(), t:Date.now()}); if (file.length>60) file.shift(); pompeFile(); },
      reveille(){ if (!pret && !fini){ attente=1500; if (ws){ try { ws.onclose=null; ws.close(); } catch(e){} } ws=null; ouvre(); } },
      ferme(){ fini=true; clearTimeout(minuteur); try { ws && ws.close(); } catch(e){} } };
  }
  function transportMqtt(url, k, recoit, change){
    if (!window.mqtt) return null;
    const sujet = "bateau-ecole/"+k.tag;
    let c = null;
    try { c = mqtt.connect(url, {clientId:"be_"+rid(8), clean:true, keepalive:30, reconnectPeriod:6000, connectTimeout:10000, protocolVersion:4}); } catch(e){ return null; }
    c.on("connect", ()=>{ c.subscribe(sujet, {qos:0}); change(); });
    c.on("close", change); c.on("offline", change); c.on("error", ()=>{});
    c.on("message", (t,p)=>{ if (t===sujet) recoit(td.decode(p)); });
    return { nom:url.replace(/^wss:\/\//,"").replace(/\/mqtt$/,""), pret:()=>c.connected,
      envoie(txts){ if (c.connected) txts.forEach(txt=>c.publish(sujet, txt, {qos:0})); },
      reveille(){ if (!c.connected){ try { c.reconnect(); } catch(e){} } },
      ferme(){ try { c.end(true); } catch(e){} } };
  }
  /* ordinateur ouvert depuis le téléphone : messages directs par le Wi-Fi */
  function transportTelephone(lien, recoit, change){
    lien.surTrame(recoit); lien.surEtat(change);
    return { nom:"Wi-Fi du téléphone", pret:()=>lien.pret(), envoie(txts){ txts.forEach(d=>lien.envoie(d)); }, reveille(){ lien.reveille(); }, ferme(){} };
  }
  /* appli du téléphone : les ordinateurs reliés à son serveur Wi-Fi */
  function transportServeur(srv, recoit, change){
    srv.surTrame(recoit); srv.surClients(change);
    return { nom:"Wi-Fi de ce téléphone", pret:()=>srv.clients()>0, envoie(txts){ if (srv.clients()) txts.forEach(d=>srv.envoie(d)); }, reveille(){}, ferme(){} };
  }
  function transportLocal(k, recoit, change){ // même navigateur (tests, deux onglets)
    const bc = new BroadcastChannel("bateau-ecole-"+k.tag); bc.onmessage = e=>recoit(e.data); setTimeout(change,0);
    return { nom:"local", pret:()=>true, envoie(txts){ txts.forEach(txt=>bc.postMessage(txt)); }, reveille(){}, ferme(){ bc.close(); } };
  }
  function creeRelais(k, extra){
    const vus = new Map(), morceaux = new Map(), ecoute = new Set(), surChange = new Set();
    const change = () => surChange.forEach(f=>{ try { f(); } catch(e){} });
    async function recoit(txt){
      let u; try { u = await dechiffre(k, txt); } catch(e){ return; } // pas pour nous, ou abîmé
      if (u[0]===2){ // message coupé en morceaux : [2][id 8 o][rang][nombre][données]
        const id = "m"+hex(u.subarray(1,9)), i = u[9], n = u[10]; if (vus.has(id)) return;
        let p = morceaux.get(id); if (!p){ p = {n, m:[], t:Date.now()}; morceaux.set(id,p); }
        if (!p.m[i]) p.m[i] = u.slice(11);
        for (let j=0;j<p.n;j++) if (!p.m[j]) return;
        morceaux.delete(id); vus.set(id, Date.now()); u = cat(...p.m);
      }
      let m; try { m = JSON.parse(td.decode(u[0]===1 ? await gzip(u.subarray(1), false) : u.subarray(1))); } catch(e){ return; }
      if (!m || typeof m!=="object" || !m.id || vus.has(m.id)) return;
      vus.set(m.id, Date.now());
      if (Math.abs(Date.now()-(m.t||0)) > 15*60*1000) return; // vieux message rejoué
      ecoute.forEach(f=>{ try { f(m); } catch(e){ console.error(e); } });
    }
    const trs = listeRelais().map(s=>{
      if (s.startsWith("local:")) return transportLocal(k, recoit, change);
      if (s.startsWith("nostr:")) return window.NostrLite ? transportNostr(s.slice(6), k, recoit, change) : null;
      if (s.startsWith("mqtt:")) return transportMqtt(s.slice(5), k, recoit, change);
      return null;
    }).filter(Boolean).concat((extra||[]).map(f=>f(recoit, change)).filter(Boolean));
    setInterval(()=>{ const lim = Date.now()-20*60*1000; vus.forEach((t,id)=>{ if (t<lim) vus.delete(id); }); morceaux.forEach((p,id)=>{ if (p.t<lim) morceaux.delete(id); }); }, 60000);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") trs.forEach(t=>t.reveille()); });
    addEventListener("online", ()=>trs.forEach(t=>t.reveille()));
    let file = Promise.resolve();
    function publie(m, cle){
      m.id = m.id || rid(9); m.t = Date.now(); vus.set(m.id, Date.now());
      const tache = file.then(async ()=>{
        const brut = te.encode(JSON.stringify(m)); let corps = brut, drapeau = 0;
        if (brut.length > 900 && window.CompressionStream){ try { corps = await gzip(brut, true); drapeau = 1; } catch(e){ corps = brut; drapeau = 0; } }
        const plein = cat(Uint8Array.of(drapeau), corps), MAX = 20000, trames = [];
        if (plein.length <= MAX) trames.push(plein);
        else { const id = crypto.getRandomValues(new Uint8Array(8)), n = Math.ceil(plein.length/MAX); if (n>250) throw new Error("trop gros");
          for (let i=0;i<n;i++) trames.push(cat(Uint8Array.of(2), id, Uint8Array.of(i,n), plein.subarray(i*MAX,(i+1)*MAX))); }
        const txts = []; for (const tr of trames) txts.push(await chiffre(k, tr));
        trs.forEach(t=>t.envoie(txts, cle));
      });
      file = tache.catch(()=>{});
      return tache;
    }
    return { publie, ecoute:f=>{ ecoute.add(f); return ()=>ecoute.delete(f); }, surChange:f=>{ surChange.add(f); return ()=>surChange.delete(f); },
      etat:()=>trs.map(t=>({nom:t.nom, ok:t.pret()})), connecte:()=>trs.some(t=>t.pret()) };
  }

  /* ---------- sauvegarde (même interface que la capacité db) ---------- */
  const DB = (() => {
    const cache = new Map(), ecoutes = new Map();
    const cle = p => "bateau-db:"+p;
    async function lit(p){ if (cache.has(p)) return cache.get(p); let v = null; try { v = JSON.parse(await Stock.get(cle(p))||"null"); } catch(e){} cache.set(p, v); return v; }
    const snap = (p, v, distant) => ({ id:p.split("/").pop(), path:p, exists:!!(v && v.data!=null), distant:!!distant,
      data:()=> v && v.data!=null ? JSON.parse(JSON.stringify(v.data)) : undefined });
    function notifie(p, v, distant){ (ecoutes.get(p)||new Set()).forEach(f=>{ try { f(snap(p,v,distant)); } catch(e){ console.error(e); } }); }
    async function ecrit(p, data, distant){
      const v = {data, rev:Date.now()}; cache.set(p, v); await Stock.set(cle(p), JSON.stringify(v));
      if (!distant) Sync.change(p); notifie(p, v, distant); return v;
    }
    function doc(p){ return { id:p.split("/").pop(), path:p,
      async get(){ return snap(p, await lit(p)); },
      async set(data){ await ecrit(p, JSON.parse(JSON.stringify(data)), false); },
      async update(patch){ const v = await lit(p); await ecrit(p, Object.assign({}, v && v.data, JSON.parse(JSON.stringify(patch))), false); },
      async delete(){ cache.set(p, null); await Stock.del(cle(p)); notifie(p, null, false); },
      onSnapshot(f){ if (!ecoutes.has(p)) ecoutes.set(p, new Set()); ecoutes.get(p).add(f); lit(p).then(v=>f(snap(p,v,false))); return ()=>ecoutes.get(p).delete(f); } }; }
    return { doc, _lit:lit, _ecritDistant:(p,d)=>ecrit(p,d,true) };
  })();

  /* ---------- le téléphone garde une copie du voyage ----------
     Un ordinateur d'école remis à zéro (profil effacé) retrouve le voyage dès que le téléphone se reconnecte.
     Même voyage : la version la plus récente gagne. Voyages différents : le plus avancé gagne,
     sauf « Tout recommencer » ou une copie restaurée exprès (champ remplace). */
  const Sync = (() => {
    /* jeu/etat : le voyage du Bateau-école (écrit par l'écran de la classe, gardé en copie par le téléphone)
       classe/actuelle : la classe (élèves, cartes, absences), modifiable des deux côtés : la plus récente gagne */
    const voyage = d => d ? {voyage:d.voyage||null, remplace:d.remplace||null, maj:d.maj||0,
      prog:(d.milles||0)*1000 + ((d.journal&&d.journal.length)||0) + Object.keys((d.stats&&d.stats.q)||{}).length} : null;
    function prefereVoyage(a, b){ // b doit-il remplacer a ?
      if (!b) return false; if (!a) return true;
      if (b.remplace && b.remplace===a.voyage) return true;
      if (a.remplace && a.remplace===b.voyage) return false;
      if (a.voyage && a.voyage===b.voyage) return b.maj > a.maj;
      if (a.prog!==b.prog) return b.prog > a.prog;
      return b.maj > a.maj;
    }
    const REGLES = {
      "jeu/etat": {resume:voyage, prefere:prefereVoyage, delai:6000},
      "classe/actuelle": {resume:d=>d ? {id:d.id||null, maj:d.maj||0} : null, prefere:(a,b)=>!!b && b.maj>0 && (!a || b.maj>a.maj), delai:700}
    };
    const DOCS = Object.keys(REGLES);
    let room = null, minuteurs = {}, premiers = {};
    const pairsLa = () => room && room._pairs().length>0;
    async function envoieDoc(p){ const v = await DB._lit(p); if (!v || !v.data || !room) return; room._publie({k:"db", path:p, data:v.data}, "db:"+p).catch(e=>console.warn("copie", e)); }
    const attente = new Set();
    function change(p){
      if (!REGLES[p]) return; attente.add(p);
      if (!pairsLa()) return;
      clearTimeout(minuteurs[p]); if (!premiers[p]) premiers[p] = Date.now();
      const delai = Date.now()-premiers[p] > 20000 ? 0 : REGLES[p].delai; // au plus tard 20 s après le premier changement
      minuteurs[p] = setTimeout(()=>{ premiers[p] = 0; attente.delete(p); envoieDoc(p); }, delai);
    }
    async function annonce(){ if (!room) return; const revs = {}; for (const p of DOCS){ const v = await DB._lit(p); revs[p] = REGLES[p].resume(v && v.data); } room._publie({k:"dbrev", revs}, "dbrev").catch(()=>{}); }
    async function recoit(m){
      if (m.k==="dbrev" && m.revs){ for (const p of DOCS){ const R = REGLES[p], v = await DB._lit(p), a = R.resume(v && v.data), b = m.revs[p]||null; if (a && R.prefere(b, a)) envoieDoc(p); } }
      const R = m.k==="db" && REGLES[m.path];
      if (R && m.data && typeof m.data==="object"){
        const v = await DB._lit(m.path);
        if (!R.prefere(R.resume(v && v.data), R.resume(m.data))) return;
        if (m.path==="jeu/etat" && mode()==="tbi"){ if (typeof window.recupereEtat==="function") window.recupereEtat(m.data); return; } // le jeu décide, puis enregistre
        await DB._ecritDistant(m.path, m.data); // copie gardée, et la classe mise à jour de ce côté
      }
    }
    return { branche(r){ room = r; }, change, annonce, recoit, nouveauPair(){ annonce(); [...attente].forEach(change); } };
  })();

  /* ---------- liaison (même interface que la capacité room) ---------- */
  function creeRoom(rel){
    const moi = {peer:rid(12), presence:{}};
    const pairs = new Map(), ecPairs = new Set(), ecSujets = new Map(), ecCo = new Set();
    const vue = p => ({peer:p.peer, by:null, isMe:p.peer===moi.peer, sameTab:p.peer===moi.peer, kind:"viewer", guest:false, presence:JSON.parse(JSON.stringify(p.presence||{}))});
    const tous = () => [vue(moi)].concat([...pairs.values()].map(vue));
    const signale = (j,l) => { const ch = {peers:tous(), joined:j.map(vue), left:l.map(vue)}; ecPairs.forEach(f=>{ try { f(ch); } catch(e){ console.error(e); } }); };
    let rep = null;
    const coucou = () => rel.publie({k:"hb", f:moi.peer, p:moi.presence}, "hb").catch(()=>{});
    const ETATS = {q:1, scan:1, ecran:1}; // sujets du jeu qui décrivent un état complet : le dernier suffit
    rel.ecoute(m=>{
      if (m.f===moi.peer) return;
      if (m.k==="hb"){ const neuf = !pairs.has(m.f), p = pairs.get(m.f) || {peer:m.f}, avant = JSON.stringify(p.presence||null);
        p.presence = m.p && typeof m.p==="object" ? m.p : {}; p.vu = Date.now(); pairs.set(m.f, p);
        if (neuf){ signale([p],[]); clearTimeout(rep); rep = setTimeout(coucou, 150+Math.random()*350); Sync.nouveauPair(); }
        else if (avant!==JSON.stringify(p.presence)) signale([],[]);
        return; }
      if (m.k==="bye"){ const p = pairs.get(m.f); if (p){ pairs.delete(m.f); signale([],[p]); } return; }
      if (m.k==="ev" && typeof m.topic==="string"){ const s = ecSujets.get(m.topic); if (s){ const msg = {topic:m.topic, data:m.data, peer:m.f, by:null, isMe:false, sameTab:false, kind:"viewer", guest:false}; s.forEach(f=>{ try { f(msg); } catch(e){ console.error(e); } }); } return; }
      Sync.recoit(m);
    });
    setInterval(coucou, 8000);
    setInterval(()=>{ const lim = Date.now()-26000, partis = []; pairs.forEach((p,id)=>{ if (p.vu<lim){ pairs.delete(id); partis.push(p); } }); if (partis.length) signale([],partis); }, 2000);
    let co = false; rel.surChange(()=>{ const c = rel.connecte(); if (c && !co) coucou(); if (c!==co){ co = c; ecCo.forEach(f=>{ try { f(c); } catch(e){} }); } });
    addEventListener("pagehide", ()=>{ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); });
    coucou();
    const r = {
      presence(patch){ for (const k in patch||{}){ if (patch[k]===null) delete moi.presence[k]; else moi.presence[k] = patch[k]; } coucou(); return Promise.resolve(); },
      onPeers(f){ ecPairs.add(f); setTimeout(()=>{ if (ecPairs.has(f)){ const t = tous(); f({peers:t, joined:t, left:[]}); } }, 0); return ()=>ecPairs.delete(f); },
      emit(topic, data){ const s = ecSujets.get(topic); if (s){ const msg = {topic, data, peer:moi.peer, by:null, isMe:true, sameTab:true, kind:"viewer", guest:false}; s.forEach(f=>{ try { f(msg); } catch(e){} }); }
        return rel.publie({k:"ev", f:moi.peer, topic, data}, ETATS[topic] ? "ev:"+topic : null).catch(()=>{}); },
      on(topic, f){ if (!ecSujets.has(topic)) ecSujets.set(topic, new Set()); ecSujets.get(topic).add(f); return ()=>ecSujets.get(topic).delete(f); },
      connected:()=>rel.connecte(),
      onConnection(f){ ecCo.add(f); return ()=>ecCo.delete(f); },
      join(){ return Promise.reject({code:"not_permitted", message:"join n'existe pas dans la version autonome"}); },
      leave(){ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); },
      _pairs:()=>[...pairs.values()].map(vue), _publie:(m,cle)=>rel.publie(Object.assign(m, {f:moi.peer}), cle), _etat:()=>rel.etat()
    };
    Sync.branche(r);
    return r;
  }
  /* ---------- ordinateur ouvert depuis le téléphone : lien direct par le Wi-Fi ----------
     Le téléphone donne le code de la classe quand la maîtresse accepte cet ordinateur (tout de suite s'il le connaît déjà). */
  const LienTel = LOCAL ? (() => {
    let ws = null, pret = false, attente = 800, minuteur = null, etat = "attente";
    const trames = new Set(), etats = new Set(), codes = new Set();
    const url = "ws://" + location.hostname + ":" + LOCAL.ws;
    const signale = e => { if (e) etat = e; etats.forEach(f=>{ try { f(etat); } catch(x){} }); };
    function ouvre(){
      clearTimeout(minuteur); minuteur = null;
      try { ws = new WebSocket(url); } catch(e){ return plusTard(); }
      const moi = ws;
      ws.onopen = ()=>{ moi.send(JSON.stringify({t:"bonjour", jeton:lsG("bateau-ecole-jeton")||""})); signale(pret ? "reconnexion" : "attente"); };
      ws.onmessage = e=>{ let o; try { o = JSON.parse(e.data); } catch(x){ return; }
        if (o.t==="code" && normalise(o.code)){ if (o.jeton) lsS("bateau-ecole-jeton", o.jeton); pret = true; attente = 800; signale("accepte"); codes.forEach(f=>f(normalise(o.code))); }
        else if (o.t==="refus"){ pret = false; signale("refuse"); }
        else if (o.t==="f" && pret && typeof o.d==="string") trames.forEach(f=>f(o.d)); };
      ws.onclose = ()=>{ if (moi!==ws) return; const avant = pret; pret = false; if (etat!=="refuse") signale(avant ? "perdu" : etat); plusTard(); };
      ws.onerror = ()=>{ try { moi.close(); } catch(e){} };
    }
    function plusTard(){ if (minuteur || etat==="refuse") return; minuteur = setTimeout(ouvre, attente); attente = Math.min(8000, attente*1.6); }
    setInterval(()=>{ if (pret) try { ws.send('{"t":"p"}'); } catch(e){} }, 20000);
    ouvre();
    return { pret:()=>pret, etat:()=>etat, envoie:d=>{ if (pret) try { ws.send(JSON.stringify({t:"f", d})); } catch(e){} },
      surTrame:f=>trames.add(f), surEtat:f=>etats.add(f), surCode:f=>codes.add(f),
      reessaie(){ etat = "attente"; attente = 800; try { ws && ws.close(); } catch(e){} ouvre(); },
      reveille(){ if (!pret && etat!=="refuse"){ attente = 800; ouvre(); } } };
  })() : null;

  /* ---------- appli du téléphone : serveur Wi-Fi pour afficher le jeu sur un ordinateur sans internet ---------- */
  const Serveur = (() => {
    const P = plug("ServeurClasse"); if (!P) return null;
    let infos = {actif:false, clients:0, adresses:[], http:0}, demandeAccord = null;
    const trames = new Set(), clientsCb = new Set(), majCb = new Set();
    const annonce = () => majCb.forEach(f=>{ try { f(infos); } catch(e){} });
    try {
      P.addListener("trame", e=>{ if (e && typeof e.d==="string") trames.forEach(f=>f(e.d)); });
      P.addListener("clients", e=>{ infos.clients = (e && e.clients) || 0; clientsCb.forEach(f=>f()); annonce(); });
      P.addListener("demande", async e=>{
        if (!e || !e.id) return;
        const code = Liaison.code(); if (!code){ P.refuse({id:e.id}).catch(()=>{}); return; }
        let connus = []; try { connus = JSON.parse(await Stock.get("bateau-ecole-ordinateurs")||"[]"); } catch(x){}
        const connu = e.jeton && connus.find(o=>o.jeton===e.jeton);
        if (connu){ connu.t = Date.now(); connu.ip = e.ip; await Stock.set("bateau-ecole-ordinateurs", JSON.stringify(connus)); P.accepte({id:e.id, code, jeton:connu.jeton}).catch(()=>{}); return; }
        const ok = demandeAccord ? await demandeAccord(e.ip) : false;
        if (!ok){ P.refuse({id:e.id}).catch(()=>{}); return; }
        const jeton = rid(12); connus.push({jeton, ip:e.ip, t:Date.now()});
        await Stock.set("bateau-ecole-ordinateurs", JSON.stringify(connus.slice(-8)));
        P.accepte({id:e.id, code, jeton}).catch(()=>{});
      });
    } catch(e){ return null; }
    async function demarre(){ try { infos = Object.assign(infos, await P.demarre()); await Stock.set("bateau-ecole-serveur", "1"); } catch(e){ console.warn("serveur", e); } annonce(); return infos; }
    async function arrete(){ try { infos = Object.assign(infos, await P.arrete()); } catch(e){} await Stock.del("bateau-ecole-serveur"); annonce(); return infos; }
    async function rafraichit(){ try { infos = Object.assign(infos, await P.etat()); } catch(e){} annonce(); return infos; }
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && infos.actif) setTimeout(rafraichit, 800); });
    return { demarre, arrete, rafraichit, infos:()=>infos, clients:()=>infos.clients||0,
      envoie:d=>P.envoie({d}).catch(()=>{}), surTrame:f=>trames.add(f), surClients:f=>clientsCb.add(f), surMaj:f=>{ majCb.add(f); return ()=>majCb.delete(f); },
      surDemande:f=>{ demandeAccord = f; }, voulu:async()=>(await Stock.get("bateau-ecole-serveur"))==="1" };
  })();

  /* ---------- code de la classe et liaison (même interface que la capacité room) ---------- */
  const Liaison = (() => {
    let code = null, promesse = null, room = null;
    const CLE = "bateau-ecole-liaison";
    async function litCode(){
      const m = /[#&?]lien=([0-9A-Za-z-]+)/.exec(location.href);
      if (m){ const c = normalise(m[1]); if (c){ await Stock.set(CLE, c); return c; } }
      return normalise(await Stock.get(CLE));
    }
    function ouvre(){
      if (promesse) return promesse;
      promesse = (async()=>{
        role = LOCAL ? "tbi" : (lsG("bateau-ecole-mode") || "tbi");
        const extra = [];
        if (LOCAL){ // le code vient du téléphone, une fois l'ordinateur accepté
          code = await new Promise(ok=>LienTel.surCode(ok));
          await Stock.set(CLE, code);
          LienTel.surCode(c=>{ if (c!==code) location.reload(); }); // le téléphone a changé de classe
          extra.push((recoit, change)=>transportTelephone(LienTel, recoit, change));
        } else {
          code = await litCode();
          if (!code && mode()!=="tel"){ code = nouveauCode(); await Stock.set(CLE, code); }
          if (Serveur){ extra.push((recoit, change)=>transportServeur(Serveur, recoit, change)); if (code && await Serveur.voulu()) Serveur.demarre(); }
        }
        if (!code) return null;
        room = creeRoom(creeRelais(await cles(code), extra));
        return room;
      })().catch(e=>{ console.error("liaison", e); return null; });
      return promesse;
    }
    const lienWeb = c => WEB + "#lien=" + (c||code);
    return { ouvre, code:()=>code, normalise, WEB, lienWeb,
      async fixe(c){ c = normalise(c); if (!c) return false; if (Serveur && c!==code && Serveur.infos().actif) await Serveur.arrete().then(()=>Stock.set("bateau-ecole-serveur","1")); await Stock.set(CLE, c); return true; },
      async oublie(){ await Stock.del(CLE); },
      async nouveau(){ const c = nouveauCode(); await Stock.set(CLE, c); return c; },
      /* le téléphone crée son propre code s'il n'en a pas encore (lien à envoyer, Wi-Fi sans internet) */
      async assure(){ return code || normalise(await Stock.get(CLE)) || await this.nouveau(); },
      etat:()=>room ? room._etat() : [], pairs:()=>room ? room._pairs() : [],
      lien:c=>"bateauecole://lier/"+(c||code),
      qr(c, taille, texte){ if (!window.qrcode) return ""; const q = qrcode(0,"M"); q.addData(texte || ("bateauecole://lier/"+(c||code))); q.make();
        return q.createSvgTag({cellSize:Math.max(2, Math.floor((taille||240)/(q.getModuleCount()+8))), margin:4, scalable:true}); } };
  })();

  /* rôle par défaut : l'appli sur un téléphone lit les cartes ; un ordinateur (ou une page servie par le téléphone) affiche le jeu */
  function modeParDefaut(){
    if (LOCAL) return "tbi";
    const petit = Math.min(screen.width||innerWidth, screen.height||innerHeight) < 600;
    if (NATIF) return petit ? "tel" : "";
    if (/[#&?]lien=/.test(location.href)) return "tbi";
    return petit ? "" : "tbi";
  }

  /* ---------- fichiers (sons personnalisés), gardés dans IndexedDB ---------- */
  const Fichiers = (() => {
    const urls = new Map();
    let base = null;
    const ouvreBase = () => base || (base = new Promise((ok, ko)=>{ const r = indexedDB.open("bateau-ecole-fichiers", 1);
      r.onupgradeneeded = ()=>r.result.createObjectStore("f", {keyPath:"id"}); r.onsuccess = ()=>ok(r.result); r.onerror = ()=>ko(r.error); }));
    async function tx(ecrire, fn){ const b = await ouvreBase(); return new Promise((ok, ko)=>{ const t = b.transaction("f", ecrire?"readwrite":"readonly"); const req = fn(t.objectStore("f"));
      t.oncomplete = ()=>ok(req && "result" in req ? req.result : undefined); t.onerror = ()=>ko(t.error); t.onabort = ()=>ko(t.error); }); }
    const pret = (async()=>{ try { (await tx(false, st=>st.getAll())).forEach(f=>urls.set(f.id, URL.createObjectURL(f.blob))); } catch(e){} })();
    window.__urlAsset = id => urls.get(id) || null;
    return { pret,
      async upload(blob, o){ const type = (o && o.type) || blob.type || "application/octet-stream", b = blob.type===type ? blob : new Blob([blob], {type}), id = rid(12);
        await tx(true, st=>st.put({id, blob:b, type, taille:b.size, t:Date.now()})); const url = URL.createObjectURL(b); urls.set(id, url);
        return {id, url, sizeBytes:b.size, contentType:type}; },
      async list(){ const l = await tx(false, st=>st.getAll()); return {assets:l.map(f=>({id:f.id, url:urls.get(f.id)||null, sizeBytes:f.taille, contentType:f.type})), usage:{bytes:l.reduce((a,f)=>a+f.taille,0)}}; },
      async delete(id){ await tx(true, st=>st.delete(id)); const u = urls.get(id); if (u){ URL.revokeObjectURL(u); urls.delete(id); } } };
  })();

  /* ---------- téléchargements : fichier dans le navigateur, feuille de partage dans l'appli ---------- */
  const Telechargements = {
    async save({filename, data}){
      const nom = String(filename||"bateau-ecole.json").replace(/[\\/:*?"<>|]/g,"-");
      if (NATIF){ const FS = plug("Filesystem"), Partage = plug("Share");
        if (FS && Partage){ const texte = typeof data==="string" ? data : JSON.stringify(data);
          const r = await FS.writeFile({path:nom, data:texte, directory:"CACHE", encoding:"utf8"});
          try { await Partage.share({title:nom, files:[r.uri]}); } catch(e){ throw {code:"cancelled", message:String(e && e.message || e)}; }
          return; } }
      const blob = data instanceof Blob ? data : new Blob([typeof data==="string" ? data : JSON.stringify(data)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    }
  };

  /* ---------- partager un fichier (PDF des cartes, sauvegarde) : feuille de partage dans l'appli, téléchargement ailleurs ---------- */
  const blobEnB64 = blob => new Promise((ok, ko)=>{ const r = new FileReader(); r.onload = ()=>ok(String(r.result).split(",")[1]||""); r.onerror = ko; r.readAsDataURL(blob); });
  async function partageFichier(nom, blob){
    nom = String(nom||"fichier").replace(/[\\/:*?"<>|]/g, "-");
    if (NATIF){ const FS = plug("Filesystem"), P = plug("Share");
      if (FS && P){ const r = await FS.writeFile({path:nom, data:await blobEnB64(blob), directory:"CACHE"}); try { await P.share({title:nom, files:[r.uri]}); } catch(e){} return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  /* ---------- lien de liaison ouvert depuis le QR code (appareil photo de l'iPhone) ---------- */
  async function traiteLien(url){
    const m = /lier\/([0-9A-Za-z-]+)/.exec(url||""); if (!m) return;
    const c = normalise(m[1]); if (!c) return;
    const avant = normalise(await Stock.get("bateau-ecole-liaison"));
    if (c===avant && mode()==="tel") return;
    await Stock.set("bateau-ecole-liaison", c); lsS("bateau-ecole-mode", "tel"); location.reload();
  }
  if (NATIF){ const App = plug("App"); if (App){ try { App.addListener("appUrlOpen", e=>traiteLien(e && e.url)); App.getLaunchUrl().then(r=>r && r.url && traiteLien(r.url)).catch(()=>{}); } catch(e){} } }

  /* ---------- garder l'écran allumé (caméra en direct) ---------- */
  let verrou = null;
  async function eveille(on){
    const KA = plug("KeepAwake");
    if (KA){ try { on ? await KA.keepAwake() : await KA.allowSleep(); } catch(e){} return; }
    try { if (on && navigator.wakeLock && !verrou) verrou = await navigator.wakeLock.request("screen"); else if (!on && verrou){ await verrou.release(); verrou = null; } } catch(e){}
  }

  window.claude = { use: async name => {
    if (name==="db") return DB;
    if (name==="room") return await Liaison.ouvre();
    if (name==="assets") return Fichiers;
    if (name==="downloads") return Telechargements;
    return null;
  } };
  return { NATIF, LOCAL, Liaison, Serveur, LienTel, Stock, eveille, rid, normalise, modeParDefaut, partageFichier, partage:plug("Share") };
})();
window.Autonome = Autonome;

</script>

/*
References:
- "OpenCV: Open Computer Vision Library"
  http://sourceforge.net/projects/opencvlibrary/
- "Stack Blur: Fast But Goodlooking"
  http://incubator.quasimondo.com/processing/fast_blur_deluxe.php

var CV = CV || {};
this.CV = CV;

CV.Image = function(width, height, data){
  this.width = width || 0;
  this.height = height || 0;
  this.data = data || [];
};

CV.grayscale = function(imageSrc, imageDst){
  var src = imageSrc.data, dst = imageDst.data, len = src.length,
      i = 0, j = 0;

  for (; i < len; i += 4){
    dst[j ++] =
      (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114 + 0.5) & 0xff;
  }

  imageDst.width = imageSrc.width;
  imageDst.height = imageSrc.height;

  return imageDst;
};

CV.threshold = function(imageSrc, imageDst, threshold){
  var src = imageSrc.data, dst = imageDst.data,
      len = src.length, tab = [], i;

  for (i = 0; i < 256; ++ i){
    tab[i] = i <= threshold? 0: 255;
  }

  for (i = 0; i < len; ++ i){
    dst[i] = tab[ src[i] ];
  }

  imageDst.width = imageSrc.width;
  imageDst.height = imageSrc.height;

  return imageDst;
};

CV.adaptiveThreshold = function(imageSrc, imageDst, kernelSize, threshold){
  var src = imageSrc.data, dst = imageDst.data, len = src.length, tab = [], i;

  CV.stackBoxBlur(imageSrc, imageDst, kernelSize);

  for (i = 0; i < 768; ++ i){
    tab[i] = (i - 255 <= -threshold)? 255: 0;
  }

  for (i = 0; i < len; ++ i){
    dst[i] = tab[ src[i] - dst[i] + 255 ];
  }

  imageDst.width = imageSrc.width;
  imageDst.height = imageSrc.height;

  return imageDst;
};

CV.otsu = function(imageSrc){
  var src = imageSrc.data, len = src.length, hist = [],
      threshold = 0, sum = 0, sumB = 0, wB = 0, wF = 0, max = 0,
      mu, between, i;

  for (i = 0; i < 256; ++ i){
    hist[i] = 0;
  }

  for (i = 0; i < len; ++ i){
    hist[ src[i] ] ++;
  }

  for (i = 0; i < 256; ++ i){
    sum += hist[i] * i;
  }

  for (i = 0; i < 256; ++ i){
    wB += hist[i];
    if (0 !== wB){

      wF = len - wB;
      if (0 === wF){
        break;
      }

      sumB += hist[i] * i;

      mu = (sumB / wB) - ( (sum - sumB) / wF );

      between = wB * wF * mu * mu;

      if (between > max){
        max = between;
        threshold = i;
      }
    }
  }

  return threshold;
};

CV.stackBoxBlurMult =
  [1, 171, 205, 293, 57, 373, 79, 137, 241, 27, 391, 357, 41, 19, 283, 265];

CV.stackBoxBlurShift =
  [0, 9, 10, 11, 9, 12, 10, 11, 12, 9, 13, 13, 10, 9, 13, 13];

CV.BlurStack = function(){
  this.color = 0;
  this.next = null;
};

CV.stackBoxBlur = function(imageSrc, imageDst, kernelSize){
  var src = imageSrc.data, dst = imageDst.data,
      height = imageSrc.height, width = imageSrc.width,
      heightMinus1 = height - 1, widthMinus1 = width - 1,
      size = kernelSize + kernelSize + 1, radius = kernelSize + 1,
      mult = CV.stackBoxBlurMult[kernelSize],
      shift = CV.stackBoxBlurShift[kernelSize],
      stack, stackStart, color, sum, pos, start, p, x, y, i;

  stack = stackStart = new CV.BlurStack();
  for (i = 1; i < size; ++ i){
    stack = stack.next = new CV.BlurStack();
  }
  stack.next = stackStart;

  pos = 0;

  for (y = 0; y < height; ++ y){
    start = pos;

    color = src[pos];
    sum = radius * color;

    stack = stackStart;
    for (i = 0; i < radius; ++ i){
      stack.color = color;
      stack = stack.next;
    }
    for (i = 1; i < radius; ++ i){
      stack.color = src[pos + i];
      sum += stack.color;
      stack = stack.next;
    }

    stack = stackStart;
    for (x = 0; x < width; ++ x){
      dst[pos ++] = (sum * mult) >>> shift;

      p = x + radius;
      p = start + (p < widthMinus1? p: widthMinus1);
      sum -= stack.color - src[p];

      stack.color = src[p];
      stack = stack.next;
    }
  }

  for (x = 0; x < width; ++ x){
    pos = x;
    start = pos + width;

    color = dst[pos];
    sum = radius * color;

    stack = stackStart;
    for (i = 0; i < radius; ++ i){
      stack.color = color;
      stack = stack.next;
    }
    for (i = 1; i < radius; ++ i){
      stack.color = dst[start];
      sum += stack.color;
      stack = stack.next;

      start += width;
    }

    stack = stackStart;
    for (y = 0; y < height; ++ y){
      dst[pos] = (sum * mult) >>> shift;

      p = y + radius;
      p = x + ( (p < heightMinus1? p: heightMinus1) * width );
      sum -= stack.color - dst[p];

      stack.color = dst[p];
      stack = stack.next;

      pos += width;
    }
  }

  return imageDst;
};

CV.gaussianBlur = function(imageSrc, imageDst, imageMean, kernelSize){
  var kernel = CV.gaussianKernel(kernelSize);

  imageDst.width = imageSrc.width;
  imageDst.height = imageSrc.height;

  imageMean.width = imageSrc.width;
  imageMean.height = imageSrc.height;

  CV.gaussianBlurFilter(imageSrc, imageMean, kernel, true);
  CV.gaussianBlurFilter(imageMean, imageDst, kernel, false);

  return imageDst;
};

CV.gaussianBlurFilter = function(imageSrc, imageDst, kernel, horizontal){
  var src = imageSrc.data, dst = imageDst.data,
      height = imageSrc.height, width = imageSrc.width,
      pos = 0, limit = kernel.length >> 1,
      cur, value, i, j, k;

  for (i = 0; i < height; ++ i){

/* ---------- itinéraire ---------- */
function km(a,b){const R=6371,t=Math.PI/180;const dLa=(b.la-a.la)*t,dLo=(b.lo-a.lo)*t;const h=Math.sin(dLa/2)**2+Math.cos(a.la*t)*Math.cos(b.la*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const ETAPES = []; // longueur (milles de jeu) pour aller de l'escale i à i+1
for (let i=0;i<ESCALES.length-1;i++) ETAPES.push(Math.round(Math.min(220,Math.max(100,80+km(ESCALES[i],ESCALES[i+1])/55))));
const CUM = [0]; ETAPES.forEach(l => CUM.push(CUM[CUM.length-1]+l));
const TOTAL = CUM[CUM.length-1];
function position(m){ // {i: escale atteinte, p: progression 0-1 vers i+1}
  m = Math.max(0,Math.min(TOTAL,m));
  let i=0; while (i<ETAPES.length && CUM[i+1]<=m) i++;
  if (i>=ETAPES.length) return {i:ESCALES.length-1,p:1,reste:0,fin:true};
  return {i,p:(m-CUM[i])/ETAPES[i],reste:CUM[i+1]-m,fin:false};
}

  NOTIONS.forEach(n=>{ if(!o.notions.find(x=>x.id===n.id)) o.notions.push({...n}); });
  o.stats = o.stats||{q:{},el:{}}; o.stats.q=o.stats.q||{}; o.stats.el=o.stats.el||{};

}

/* version autonome : le téléphone relié garde une copie du voyage et la propose au TBI.
   Même voyage : on prend la version la plus récente. Autre voyage (ordinateur remis à zéro, autre classe) : la maîtresse choisit. */
function recupereEtat(distant){
  if (DEMO || !distant || typeof distant!=="object") return;
  const applique = ()=>{ S = charge(JSON.parse(JSON.stringify(distant))); if (window.Classe) Classe.versJeu(); sauve(); if (window.onEtatRecharge) onEtatRecharge(); };
  if ((S.voyage && distant.voyage===S.voyage) || (distant.remplace && distant.remplace===S.voyage)){ applique(); return; }
  const neuf = !S.maj || (!S.milles && !(S.journal||[]).length && !Object.keys((S.stats&&S.stats.q)||{}).length);
  if (neuf){ applique(); if ($("#stage")) toast("Voyage repris depuis le téléphone."); return; } // cet appareil n'a pas encore navigué
  if (typeof panneau!=="function" || !$("#stage")) return;
  const p = position(distant.milles||0), e = ESCALES[p.i] || ESCALES[0];
  const quand = distant.maj ? ` le ${new Date(distant.maj).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}` : "";
  const d = panneau(`<h2>Le téléphone a gardé un voyage</h2>
    <p>« ${esc(distant.nom||"Le bateau")} » : escale ${p.i+1} sur ${ESCALES.length} (${esc(e.v)}), ${distant.milles||0} milles, enregistré${quand}.</p>
    <p class="note">Cet ordinateur a ${S.milles||(S.journal&&S.journal.length) ? `un autre voyage (« ${esc(S.nom)} », ${S.milles} milles)` : "un voyage tout neuf"}. Lequel garder ?</p>
    <div class="ligne"><button class="btn prim" data-v="prendre">Reprendre le voyage du téléphone</button><button class="btn" data-v="garder">Garder celui de cet ordinateur</button></div>`);
  d.addEventListener("click", ev=>{ const b = ev.target.closest("[data-v]"); if (!b) return;
    if (b.dataset.v==="prendre"){ applique(); toast("Voyage repris depuis le téléphone."); }
    else { S.remplace = distant.voyage; sauve(); toast("Le voyage de cet ordinateur est gardé."); }
    d.remove(); });
}

/* ---------- sons (synthétisés) ---------- */
const Son = (() => {
  let ctx=null, master=null, vagues=null, pluie=null, merAu=null;
  function init(){
    if (ctx) { if (ctx.state==="suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  }
  function bruit(sec){ const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
  function on(){ return ctx && S.reglages.son; }
  function note(f,t0,dur,type="triangle",vol=.25){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05);
  }
  return {
    init,
    mer(on_){ if(!ctx) return;
      const um = AudioPerso.url("fx-mer");
      if (um || merAu){ if (on_ && S.reglages.son && um){ if(!merAu){ merAu=new Audio(um); merAu.loop=true; merAu.volume=.35; merAu.play().catch(()=>{}); } if(vagues){ vagues.src.stop(); vagues.lfo.stop(); vagues=null; } return; }
        if (merAu){ merAu.pause(); merAu=null; } if (um) return; }
      if (on_ && S.reglages.son && !vagues){
        const src=ctx.createBufferSource(); src.buffer=bruit(4); src.loop=true;
        const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=500;
        const g=ctx.createGain(); g.gain.value=.05;
        const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.12; lg.gain.value=.04; lfo.connect(lg); lg.connect(g.gain); lfo.start();
        src.connect(f); f.connect(g); g.connect(master); src.start(); vagues={src,lfo,g};
      } else if (!on_ && vagues){ vagues.src.stop(); vagues.lfo.stop(); vagues=null; }
    },
    pluie(on_){ /* bruit de pluie retiré à la demande de l'enseignante (trop agressif) */ },
    tampon(){ if(!on()) return; if(fxPerso("tampon")) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(45,t+.18);
      g.gain.setValueAtTime(.8,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g); g.connect(master); o.start(t); o.stop(t+.3); note(1320,t+.12,.5,"sine",.15); },
    cloche(){ if(!on()) return; if(fxPerso("cloche")) return; const t=ctx.currentTime; note(880,t,.9,"sine",.3); note(1320,t+.12,.9,"sine",.22); },
    fanfare(){ if(!on()) return; if(fxPerso("fanfare")) return; const t=ctx.currentTime; [523,659,784,1047,784,1047].forEach((f,i)=>note(f,t+i*.16,.35,"triangle",.28)); },
    vent(){ if(!on()) return; if(fxPerso("vent")) return; const t=ctx.currentTime; const src=ctx.createBufferSource(); src.buffer=bruit(1.4);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(1600,t+.7); f.frequency.exponentialRampToValueAtTime(400,t+1.3);
      const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.4); g.gain.linearRampToValueAtTime(0,t+1.35);
      src.connect(f); f.connect(g); g.connect(master); src.start(t); },
    tonnerre(){ if(!on()) return; if(fxPerso("tonnerre")) return; const t=ctx.currentTime; const src=ctx.createBufferSource(); src.buffer=bruit(3);
      const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=180;
      const g=ctx.createGain(); g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+2.8);
      src.connect(f); f.connect(g); g.connect(master); src.start(t); },
    plouf(){ if(!on()) return; if(fxPerso("plouf")) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(120,t+.25);
      g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g); g.connect(master); o.start(t); o.stop(t+.35); },
    pop(){ if(!on()) return; if(fxPerso("pop")) return; const t=ctx.currentTime; note(660,t,.15,"square",.12); note(990,t+.06,.2,"square",.1); },
    parle(txt,lang){ if(!S.reglages.son||!txt||!lang||!window.speechSynthesis) return false;
      const voix = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase().slice(0,2)));
      if (!voix) return false;
      const u=new SpeechSynthesisUtterance(txt); u.voice=voix; u.lang=voix.lang; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; }
  };
})();

  const cv = $("#sea"), g = cv.getContext("2d");
  let W=0,H=0,dpr=1, t0=performance.now();
  const st = {prog:0, progAff:0, vent:.2, orage:0, orageAff:0, eclair:0, dest:"", dep:"", bateau:"", haut:.72, merC:null, sC:null, merA:null, sA:null};
  const nuages = [0,1,2,3,4].map(i=>({x:i/5+Math.random()*.1,y:.02+Math.random()*.16,s:.8+Math.random()*.5,v:.004+Math.random()*.005,k:(i%3)+1}));
  const noirs = [0,1,2].map(i=>({x:i/3+Math.random()*.1,y:.02+Math.random()*.1,s:1+Math.random()*.4,v:.01+Math.random()*.01,k:(i%2)+1}));
  const gouttes = Array.from({length:180},()=>({x:Math.random(),y:Math.random(),v:.8+Math.random()*.6}));
  function taille(){ const r=cv.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height; cv.width=Math.max(1,W*dpr); cv.height=Math.max(1,H*dpr); g.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener("resize", taille);
  const mix=(a,b,k)=>a+(b-a)*k;
  function couvre(im,a){ if(!pret(im)||a<=0.01) return; const k=Math.max(W/im.naturalWidth,H/im.naturalHeight); const w=im.naturalWidth*k,h=im.naturalHeight*k; g.globalAlpha=a; g.drawImage(im,(W-w)/2,0,w,h); g.globalAlpha=1; }
  function sprite(im,x,y,w,ancre,a,rot){ if(!pret(im)||a<=0.01) return 0; const h=w*im.naturalHeight/im.naturalWidth; g.save(); g.globalAlpha=a==null?1:a; g.translate(x,y); if(rot) g.rotate(rot); g.drawImage(im,-w/2,ancre==="centre"?-h/2:-h,w,h); g.restore(); return h; }
  function bande(im,y,h,decal,fond){
    g.fillStyle=fond; g.fillRect(0,y+h*.6,W,H-(y+h*.6));
    if(!pret(im)) return; const w=h*im.naturalWidth/im.naturalHeight; let x=-(((decal%w)+w)%w);
    for(;x<W;x+=w-1) g.drawImage(im,x,y,w,h);
  }
  function etiquette(txt,x,y,fs){
    g.font=`800 ${fs}px "Baloo 2",sans-serif`; const lw=g.measureText(txt||"").width;
    const lx=Math.max(lw/2+16,Math.min(W-lw/2-16,x)); if(!txt) return {x:lx,w:0};
    g.fillStyle="#FFFCF4"; g.strokeStyle="#0B2740"; g.lineWidth=3;
    g.beginPath(); g.roundRect(lx-lw/2-12,y-fs*1.05,lw+24,fs*1.5,fs*.75); g.fill(); g.stroke();
    g.fillStyle="#0B2740"; g.textAlign="center"; g.fillText(txt,lx,y); return {x:lx,w:lw+24};
  }
  function frame(now){
    const t=(now-t0)/1000;
    st.progAff += (st.prog-st.progAff)*.02;
    st.orageAff += (st.orage-st.orageAff)*.03;
    st.vent += (.3-st.vent)*.004;
    const o=st.orageAff;
    const sDef=Math.max(.45,Math.min(1.2,Math.min(W/1300,H/720)));
    const merC = st.merC==null ? H*st.haut : st.merC, sC = st.sC==null ? sDef : st.sC;
    if (st.merA==null){ st.merA=merC; st.sA=sC; }
    st.merA += (merC-st.merA)*.12; st.sA += (sC-st.sA)*.12;
    const mer=st.merA, s=st.sA;
    // ciel, soleil, nuages
    g.fillStyle="#6CC3F2"; g.fillRect(0,0,W,H);
    couvre(IMG.ciel,1); couvre(IMG["ciel-orage"],o);
    const sol=Math.max(70,Math.min(W,H)*.16);
    sprite(IMG.soleil,W-sol*.75,sol*.62+Math.sin(t*.8)*4,sol,"centre",1-o,Math.sin(t*.4)*.08);
    nuages.forEach(n=>{ n.x+=n.v*(.3+st.vent+o*2)/60; if(n.x>1.25) n.x=-.25; sprite(IMG["nuage"+n.k],n.x*W,n.y*H+sol*.45,Math.min(W,1600)*.12*n.s,"centre",1-o*.8); });
    if(o>.02) noirs.forEach(n=>{ n.x+=n.v/60; if(n.x>1.25) n.x=-.25; sprite(IMG["orage"+n.k],n.x*W,n.y*H+sol*.5,Math.min(W,1600)*.16*n.s,"centre",o); });
    if (st.eclair>0){ g.fillStyle=`rgba(255,255,240,${st.eclair})`; g.fillRect(0,0,W,H); st.eclair-=.06; }
    // vagues du fond
    const vh = 72*s*(1+o*.4);
    bande(IMG["vague-claire"], mer-vh*.5, vh, t*(26+o*80), o>.5?"#0F5E75":"#107991");
    // port et île avec leur nom
    const fs=Math.max(15,Math.min(24,W*.015));
    const wPort=240*s, wIle=250*s;
    const hPort = pret(IMG.port) ? wPort*IMG.port.naturalHeight/IMG.port.naturalWidth : 110*s;
    const hIle = pret(IMG.ile) ? wIle*IMG.ile.naturalHeight/IMG.ile.naturalWidth : 125*s;
    const xPort=Math.max(wPort*.5+4,W*.08), xIle=Math.min(W-wIle*.5-4,W*.92);
    sprite(IMG.port,xPort,mer+16*s,wPort); sprite(IMG.ile,xIle,mer+16*s,wIle);
    const eD = etiquette(st.dep,xPort,mer+16*s-hPort-8*s,fs), eA = etiquette(st.dest,xIle,mer+16*s-hIle-8*s,fs);
    // bateau (voile gonflée selon le vent)
    const wB=290*s;
    const xMin = Math.max(xPort+wPort*.5+wB*.3, eD.x+eD.w/2+wB*.42);
    const xMax = Math.max(xMin, Math.min(xIle-wIle*.5-wB*.25, eA.x-eA.w/2-wB*.45));
    const xB = mix(xMin,xMax,Math.max(0,Math.min(1,st.progAff)));
    const roul = Math.sin(t*1.5)*.035*(1+o*2.5), yB = mer+38*s+Math.sin(t*1.5)*4*s*(1+o);
    const voile = Math.max(0,Math.min(1,(st.vent-.1)/.4));
    sprite(IMG["bateau-calme"],xB,yB,wB,"bas",1,roul);
    sprite(IMG.bateau,xB,yB,wB,"bas",voile,roul);
    // vagues de devant
    const vh2 = 64*s*(1+o*.5);
    bande(IMG["vague-foncee"], mer+20*s, vh2, t*(44+o*120), o>.5?"#062F48":"#084362");
    if (o>.05){ g.fillStyle=`rgba(40,30,80,${.2*o})`; g.fillRect(0,0,W,H);
      g.strokeStyle=`rgba(220,230,255,${.55*o})`; g.lineWidth=1.6; g.beginPath();
      gouttes.forEach(d=>{ d.y+=d.v*.02; d.x-=.004; if(d.y>1){d.y=0;d.x=Math.random()*1.2;} const x=d.x*W,y=d.y*H; g.moveTo(x,y); g.lineTo(x-6,y+18); }); g.stroke(); }
    requestAnimationFrame(frame);
  }
  return {
    st, start(){ taille(); requestAnimationFrame(frame); }, taille,
    vers(prog,dep,dest){ st.prog=prog; st.dep=dep; st.dest=dest; },
    rafale(k){ st.vent=Math.min(1,.45+k*.6); },
    orage(k){ st.orage=k; },
    eclair(){ st.eclair=.9; },
    snap(){ st.progAff=st.prog; },
    place(bas){ if(!H) return; const avail=H-bas; const sMax=Math.max(.45,Math.min(1.2,W/1100));
      let s=Math.max(.3,Math.min(sMax,(avail-12)/300)); let mer=bas+12+222*s; if(mer+72*s>H) mer = avail<100 ? H+220 : H-72*s;
      st.merC=mer; st.sC=s; }
  };
})();

/* ---------- choix des questions ---------- */
function choisirQuestions(n){
  const vues = new Set(S.notions.filter(x=>x.vue).map(x=>x.id));
  const pool = S.questions.filter(q=>vues.has(q.n) && q.c.length>=2 && q.q.trim());
  const now = Date.now();
  const w = q => { const s=S.stats.q[q.id]; if(!s) return 3; return 1 + 4*(1-s.last) + Math.min(3,(now-(s.t||0))/(7*864e5)); };
  const pris=[]; const reste=pool.slice();
  while (pris.length<n && reste.length){
    const tot = reste.reduce((a,q)=>a+w(q),0); let r=Math.random()*tot, k=0;
    for(;k<reste.length-1;k++){ r-=w(reste[k]); if(r<=0) break; }
    pris.push(reste.splice(k,1)[0]);
  }
  for (let i=1;i<pris.length;i++) if (pris[i].n===pris[i-1].n){ const j=pris.findIndex((q,x)=>x>i && q.n!==pris[i-1].n); if(j>0){ [pris[i],pris[j]]=[pris[j],pris[i]]; } }
  return pris;
}

function nettoie(a,nb){ const o={}; if(a&&typeof a==="object") for(const k in a){ const n=+k, v=a[k]; if(Number.isInteger(n)&&n>=1&&n<=NB_CARTES&&typeof v==="string"&&LET.indexOf(v)>=0&&LET.indexOf(v)<nb) o[n]=v; } return o; }

    if (mode==="tempete") majOrage();

    qv.c.forEach((_,k)=>$("#opt"+k).classList.add(k===qv.ok?"bon":"faux"));

    const act = actifs(); const rep = QCUR.rep;

    if (repondu.length){
